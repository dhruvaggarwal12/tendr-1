<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09081A">
<title>Tendr — We Curate, You Celebrate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#09081A;--sf:#0F0E24;--sf2:#141330;
  --gold:#C89B3C;--gl:#EDBD5A;--gg:rgba(200,155,60,.32);--gls:rgba(200,155,60,.08);
  --txt:#EAE5DB;--dim:#7A7590;--muted:#4A4660;
  --bdr:rgba(255,255,255,.07);--bdg:rgba(200,155,60,.2);
  --grn:#3ECF8E;--grng:rgba(62,207,142,.1);--grnb:rgba(62,207,142,.32);
}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  overflow:hidden;}

/* ── AMBIENT ── */
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);
  animation:orbf 14s ease-in-out infinite;}
.o1{width:380px;height:380px;background:radial-gradient(#C89B3C,transparent);
  top:-80px;left:-90px;opacity:.18;animation-delay:0s;}
.o2{width:300px;height:300px;background:radial-gradient(#6C3FC7,transparent);
  bottom:40px;right:-70px;opacity:.14;animation-delay:-6s;}
.o3{width:220px;height:220px;background:radial-gradient(#C89B3C,transparent);
  bottom:35%;left:15%;opacity:.1;animation-delay:-10s;}
@keyframes orbf{0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(16px,-20px) scale(1.07);}
  66%{transform:translate(-10px,13px) scale(.95);}}
.ptcl{position:absolute;border-radius:50%;background:var(--gold);
  opacity:0;animation:ptf linear infinite;}
@keyframes ptf{0%{opacity:0;transform:translateY(0);}
  12%{opacity:.55;}90%{opacity:.15;}100%{opacity:0;transform:translateY(-120px);}}

/* ── SHELL ── */
#app{position:relative;z-index:1;height:100vh;height:100dvh;
  width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* ── PROGRESS ── */
#pb{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:rgba(255,255,255,.05);}
#pf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gl));width:0%;
  transition:width .7s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px var(--gg);}

/* ── SCREEN ── */
.screen{position:absolute;width:100%;max-width:440px;
  height:100vh;height:100dvh;display:flex;flex-direction:column;}

/* ── LANG ── */
.ls{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:48px 28px;gap:0;}
.tm{margin-bottom:44px;text-align:center;}
.tl{font-size:12px;font-weight:900;letter-spacing:6px;text-transform:uppercase;
  color:var(--txt);opacity:.45;display:block;margin-bottom:6px;}
.tt{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);opacity:.65;}
.lh{text-align:center;margin-bottom:36px;animation:fu .5s ease both;}
.lhp{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;}
.lhh{font-size:30px;font-weight:900;color:var(--txt);line-height:1.2;margin-bottom:10px;}
.lhs{font-size:15px;color:var(--dim);line-height:1.7;}
.ll{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;text-align:center;}
.llist{display:flex;flex-direction:column;gap:12px;width:100%;}
.lb{display:flex;align-items:center;gap:18px;padding:20px 24px;
  background:var(--sf);border:1.5px solid var(--bdr);border-radius:20px;
  cursor:pointer;color:var(--txt);font-family:inherit;
  transition:border-color .2s,background .2s,transform .15s;
  text-align:left;touch-action:manipulation;position:relative;overflow:hidden;}
.lb::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(200,155,60,.06) 60%,transparent 80%);
  transform:translateX(-100%);transition:transform .4s ease;}
.lb:hover::after{transform:translateX(100%);}
.lb:hover{border-color:var(--bdg);background:var(--sf2);}
.lb:active{transform:scale(.97);}
.lf{font-size:28px;flex-shrink:0;}
.ln{font-size:18px;font-weight:800;display:block;}
.lsub{font-size:13px;color:var(--dim);margin-top:3px;display:block;}

/* ── QUESTION ── */
.qs{background:transparent;}
.qh{padding:calc(env(safe-area-inset-top,0px) + 20px) 24px 0;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.qdots{display:flex;gap:8px;align-items:center;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sf2);
  transition:all .4s cubic-bezier(.08,.9,.22,1);}
.dot.on{background:var(--gold);width:26px;border-radius:5px;box-shadow:0 0 12px var(--gg);}
.dot.dn{background:var(--gold);opacity:.35;}
.qnum{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted);}

/* Shifted higher: extra padding-bottom pushes center upward */
.qmid{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px);}

.qb{display:flex;flex-direction:column;padding:10px 28px 24px;}
.qbadge{display:inline-flex;align-items:center;padding:6px 14px;border-radius:30px;
  background:var(--gls);border:1px solid var(--bdg);
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin-bottom:20px;align-self:center;
  animation:fu .4s .05s ease both;}
.qhead{font-size:clamp(22px,5.8vw,28px);font-weight:900;color:var(--txt);
  line-height:1.25;margin-bottom:14px;text-align:center;animation:fu .4s .1s ease both;}
.qhead em{color:var(--gl);font-style:normal;}
.qsub{font-size:15px;color:var(--dim);line-height:1.8;text-align:center;animation:fu .4s .15s ease both;}

.qc{padding:0 20px 0;
  display:flex;flex-direction:column;gap:14px;flex-shrink:0;
  animation:fu .4s .22s ease both;}

/* ── CHOICE CARDS — 35% larger, spring-pop on select ── */
.ch{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:20px;
  border:1.5px solid;cursor:pointer;font-family:inherit;text-align:left;
  transition:transform .3s cubic-bezier(.15,1.5,.35,1),
             opacity .3s ease,
             border-color .2s ease,
             background .2s ease,
             box-shadow .3s ease;
  position:relative;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;}
.ch:active{transform:scale(.97);}
.ce{font-size:28px;flex-shrink:0;transition:transform .35s cubic-bezier(.15,1.5,.35,1);}
.ct{font-size:18px;font-weight:800;color:var(--txt);line-height:1.3;}
.cs{font-size:13px;color:var(--dim);margin-top:3px;display:block;line-height:1.5;}

.yo{background:var(--grng);border-color:var(--grnb);}
.yo:hover{background:rgba(62,207,142,.15);border-color:rgba(62,207,142,.45);}
.no{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.09);}
.no:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);}

/* Selected YES — obvious, spring-pop, glow */
.ch.cy{
  background:rgba(62,207,142,.18);
  border-color:var(--grn);
  border-width:2px;
  box-shadow:0 0 0 1px rgba(62,207,142,.3),0 10px 40px rgba(62,207,142,.2);
  transform:scale(1.02) translateY(-3px);
}
.ch.cy .ct{color:var(--grn);}
.ch.cy .ce{transform:scale(1.3);}
.ch.cy::before{
  content:'✓';position:absolute;right:20px;top:50%;
  width:30px;height:30px;border-radius:50%;
  background:var(--grn);color:#09081A;
  font-size:14px;font-weight:900;
  display:grid;place-items:center;
  transform:translateY(-50%) scale(1);
  animation:chkpop .3s cubic-bezier(.15,1.5,.35,1) both;
}
@keyframes chkpop{from{transform:translateY(-50%) scale(0);}to{transform:translateY(-50%) scale(1);}}

/* Selected NO */
.ch.cn{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.5);
  border-width:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 40px rgba(255,255,255,.04);
  transform:scale(1.02) translateY(-3px);
}
.ch.cn::before{
  content:'✓';position:absolute;right:20px;top:50%;
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.8);color:#09081A;
  font-size:14px;font-weight:900;
  display:grid;place-items:center;
  transform:translateY(-50%) scale(1);
  animation:chkpop .3s cubic-bezier(.15,1.5,.35,1) both;
}

/* Faded (unchosen) — much more aggressive */
.ch.fd{opacity:.07;transform:scale(0.97);pointer-events:none;}

/* ripple */
.ch::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.08);transform:scale(0);opacity:1;
  pointer-events:none;transition:transform .55s ease,opacity .55s ease;
  left:50%;top:50%;translate:-50% -50%;}
.ch.rp::after{transform:scale(2.4);opacity:0;}

/* ── EMPATHY OVERLAY ── */
.eov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 32px 80px;
  pointer-events:none;}
.eov.show{pointer-events:auto;}
.eov[data-s="fade"]{background:linear-gradient(180deg,var(--bg),var(--sf));
  opacity:0;transition:opacity .35s ease;}
.eov[data-s="fade"].show{opacity:1;}
.eov[data-s="card"]{top:auto;min-height:52%;background:var(--sf);
  align-items:center;text-align:center;padding:36px 32px 80px;
  opacity:1;transform:translateY(112%);
  transition:transform .5s cubic-bezier(.08,.9,.22,1);
  border-radius:24px 24px 0 0;border-top:1.5px solid var(--bdg);
  box-shadow:0 -24px 64px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.eov[data-s="card"].show{transform:translateY(0);}
.eov[data-s="wipe"]{bottom:auto;min-height:50%;background:var(--sf);
  align-items:center;text-align:center;padding:58px 32px 36px;
  opacity:1;transform:translateY(-112%);
  transition:transform .5s cubic-bezier(.08,.9,.22,1);
  border-radius:0 0 24px 24px;border-bottom:1.5px solid var(--bdg);
  box-shadow:0 24px 64px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.eov[data-s="wipe"].show{transform:translateY(0);}
.eov[data-s="punch"]{background:radial-gradient(ellipse 60% 50% at 50% 44%,
  rgba(200,155,60,.18),transparent);
  opacity:0;transform:scale(.8);
  transition:opacity .2s ease,transform .4s cubic-bezier(.15,1.6,.35,1);}
.eov[data-s="punch"].show{opacity:1;transform:scale(1);}

.ei{font-size:42px;margin-bottom:18px;
  animation:ipop .4s .1s cubic-bezier(.15,1.6,.35,1) both;}
@keyframes ipop{from{transform:scale(0);}to{transform:scale(1);}}
.et{font-size:21px;font-weight:900;color:var(--txt);line-height:1.4;margin-bottom:12px;}
.et b{color:var(--gl);}
.eb{font-size:15px;color:var(--dim);line-height:1.75;max-width:300px;}
.eov[data-s="card"] .et,.eov[data-s="wipe"] .et{font-size:19px;}
.eov[data-s="card"] .eb,.eov[data-s="wipe"] .eb{max-width:300px;}

/* progress bar inside overlay — now 3s to match new timing */
.epbar{position:absolute;bottom:40px;left:32px;right:32px;
  height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.epfill{height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold),var(--gl));
  border-radius:2px;transition:width 3s linear;box-shadow:0 0 8px var(--gg);}

.eskip{position:absolute;bottom:14px;right:22px;
  font-size:12px;font-weight:700;color:var(--muted);
  padding:12px 16px;cursor:pointer;opacity:0;
  transition:opacity .4s .5s;touch-action:manipulation;}
.eov.show .eskip{opacity:1;}

/* ── FINAL Q ── */
.fqs{background:transparent;}
.fqb{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:12px 28px 20px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 80px);}
.fqbadge{display:inline-flex;align-items:center;padding:6px 14px;border-radius:30px;
  background:var(--gls);border:1px solid var(--bdg);
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin-bottom:18px;align-self:center;animation:fu .4s .05s ease both;}
.fqh{font-size:clamp(20px,5.2vw,26px);font-weight:900;color:var(--txt);
  line-height:1.28;margin-bottom:20px;text-align:center;animation:fu .4s .1s ease both;}
.fqlist{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;
  animation:fu .4s .15s ease both;}
.fqi{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600;color:var(--dim);
  line-height:1.5;}
.fqchk{width:22px;height:22px;border-radius:50%;background:var(--gls);
  border:1.5px solid var(--bdg);display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--gold);flex-shrink:0;}
.fqend{text-align:center;font-size:16px;color:var(--dim);line-height:1.65;margin-bottom:18px;
  animation:fu .4s .2s ease both;}
.fqend strong{font-size:22px;font-weight:900;color:var(--txt);display:block;margin-top:6px;}
.fqopts{display:flex;flex-direction:column;gap:12px;animation:fu .4s .25s ease both;}
.fqbtn{width:100%;padding:19px 24px;border-radius:20px;
  border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
  cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;
  color:var(--txt);transition:all .2s;text-align:center;touch-action:manipulation;}
.fqbtn:hover{border-color:var(--bdg);background:var(--gls);}
.fqbtn:active{transform:scale(.97);}
.fqbtn.ch{background:var(--gls);border-color:var(--gold);border-width:2px;color:var(--gl);}
.fqbtn.fd{opacity:.12;pointer-events:none;}
.fqresp{margin-top:16px;padding:20px 22px;
  background:linear-gradient(135deg,rgba(200,155,60,.12),rgba(200,155,60,.04));
  border:1.5px solid var(--gold);border-radius:18px;
  font-size:16px;font-weight:600;color:var(--txt);line-height:1.65;
  display:none;animation:fu .3s ease both;text-align:center;
  box-shadow:0 4px 28px rgba(200,155,60,.18);}
.fqresp b{color:var(--gl);font-weight:900;}
.fqresp.show{display:block;}

/* ── REVEAL ── */
.ws{background:transparent;position:relative;overflow:hidden;}
.wp{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 28px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wp.in{opacity:1;pointer-events:auto;}
.wp.out{opacity:0;pointer-events:none;}

/* ph1 stat */
.sblk{text-align:center;margin-bottom:24px;}
.spre{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;}
.snum{font-size:min(19vw,96px);font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold),var(--gl),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:npop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes npop{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:scale(1);}}
.spct{font-size:32px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--gl));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ssub{font-size:16px;color:var(--dim);line-height:1.65;
  max-width:290px;margin:14px auto 0;}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;
  margin-top:24px;max-width:320px;}
.pill{padding:8px 14px;border-radius:30px;background:var(--sf);
  border:1px solid var(--bdr);font-size:12px;font-weight:600;color:var(--dim);
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;}
.pill.in{opacity:1;transform:translateY(0);}

/* ph2 pivot */
.pvpre{font-size:14px;color:var(--dim);text-align:center;margin-bottom:20px;letter-spacing:.3px;}
.pvbig{font-size:clamp(28px,7vw,38px);font-weight:900;color:var(--txt);
  text-align:center;line-height:1.2;
  opacity:0;transform:translateY(16px);transition:opacity .5s .2s,transform .5s .2s;}
.pvbig em{background:linear-gradient(135deg,var(--gold),var(--gl));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-style:normal;}
.wp.in .pvbig{opacity:1;transform:translateY(0);}

/* ph3 tendr */
.rlogo{width:min(155px,52vw);height:auto;margin-bottom:24px;flex-shrink:0;
  opacity:0;transform:scale(.85) translateY(10px);
  transition:opacity .55s,transform .55s;}
.wp.in .rlogo{opacity:1;transform:scale(1) translateY(0);}
.feats{display:flex;flex-direction:column;gap:10px;width:100%;margin-bottom:24px;}
.feat{display:flex;align-items:center;gap:14px;padding:15px 18px;
  background:linear-gradient(135deg,var(--gls),rgba(255,255,255,.02));
  border:1px solid var(--bdg);border-radius:16px;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;}
.feat.in{opacity:1;transform:translateY(0);}
.fi{font-size:22px;flex-shrink:0;}
.ft{font-size:15px;font-weight:700;color:var(--txt);line-height:1.4;}

/* glow CTA */
.ctaw{position:relative;width:100%;}
.ctag{position:absolute;inset:-10px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 50%,var(--gg),transparent 70%);
  animation:cpulse 2.6s 1s ease-in-out infinite;}
@keyframes cpulse{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:.72;transform:scale(1.05);}}
.ctab{display:flex;align-items:center;justify-content:center;
  width:100%;padding:22px 24px;
  background:linear-gradient(135deg,var(--gold),var(--gl));
  border:none;border-radius:20px;font-size:17px;font-weight:900;color:#09081A;
  cursor:pointer;font-family:inherit;text-decoration:none;position:relative;overflow:hidden;
  box-shadow:0 4px 32px var(--gg);
  opacity:0;transition:opacity .5s,transform .15s;}
.ctab.in{opacity:1;}
.ctab:active{transform:scale(.97);}
.ctab::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%);
  animation:sh 2.8s 1.2s infinite;}
@keyframes sh{0%,44%{transform:translateX(-200%);}100%{transform:translateX(200%);}}

/* ── UTILS ── */
@keyframes fu{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="amb"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="pb"><div id="pf"></div></div>
<div id="app"></div>
<script>
const L={
en:{
  skip:['Keep going →','Next →','Show me →','And? →'],
  qs:[
    {badge:'Let\'s start simple',
     head:'You have a birthday to plan. You open your phone. You stare at a blank note.',
     sub:'Close it. Open it again. Sound familiar?',

     oy:{icon:'😮‍💨',t:'<b>That blank-page paralysis is real.</b>',b:'Tendr walks you through every step — all in one place. No more staring at empty notes.'},
     on:{icon:'✨',t:'<b>That clarity is genuinely rare.</b>',b:'Tendr makes even the organised ones faster. One more.'},
    },
    {badge:'Pulling it together',
     head:'You\'ve had 6 tabs open, 3 apps, 2 WhatsApp groups — and still forgot something.',
     sub:'Every event. Always something slipping through.',
     y:{em:'😭',t:'The cake. Always the cake.',s:'We\'ve been there.'},
     n:{em:'🧘',t:'I have a system, actually.',s:'Teach us.'},
     oy:{icon:'🤯',t:'<b>The scattering is the problem.</b>',b:'Vendors, gifts, budget, guests — Tendr puts it all in one place. Tabs closed.'},
     on:{icon:'😄',t:'<b>A system person. Rare.</b>',b:'Tendr will feel like a superpower for you. One more.'},
    },
    {badge:'A week before',
     head:'You stop being a guest. You become everyone\'s unpaid coordinator.',

     y:{em:'😤',t:'I become a completely different person.',s:'Exhausting. We know.'},
     n:{em:'👌',t:'Mine just... runs itself.',s:'Genuinely rare.'},
     oy:{icon:'📋',t:'<b>That hidden labour is real.</b>',b:'Nobody talks about it. Tendr absorbs it so you don\'t have to be the coordinator anymore.'},
     on:{icon:'✨',t:'<b>That\'s a rare setup.</b>',b:'Tendr keeps it that way with even less effort. Last one.'},
    },

function prog(p){pf.style.width=p+'%';}

function go(html){
  const prev=app.querySelector('.screen');
  const w=document.createElement('div');w.innerHTML=html;
  const next=w.firstElementChild;
  next.style.cssText='transform:translateX(100%) scale(.95);opacity:0;';
  app.appendChild(next);
  if(prev){
    prev.style.transition='transform .38s cubic-bezier(.4,0,.8,0),opacity .32s ease';
    prev.style.transform='translateX(-26%) scale(.96)';
    prev.style.opacity='0';
    setTimeout(()=>prev.remove(),420);
  }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    next.style.transition='transform .44s cubic-bezier(.08,.9,.22,1),opacity .36s ease';
    next.style.transform='translateX(0) scale(1)';
    next.style.opacity='1';
  }));
}

function dots(a){
  return[0,1,2,3].map(i=>`<div class="dot${i===a?' on':i<a?' dn':''}"></div>`).join('');
}

// particles
(function(){
  const amb=document.getElementById('amb');
  for(let i=0;i<16;i++){
    const p=document.createElement('div');p.className='ptcl';
    const s=Math.random()*2.5+1.2;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*50}%;animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*8}s;`;
    amb.appendChild(p);
  }
})();

// ── QUESTION ──
function renderQ(idx){
  const q=L[lang].qs[idx];
  prog(PROG[idx+1]);
  go(`<div class="screen qs">
    <div class="qh">
      <div class="qdots">${dots(idx)}</div>
      <div class="qnum">${idx+1} of 4</div>
    </div>
    <div class="qmid">
      <div class="qb">
        <div class="qbadge">${q.badge}</div>
        <div class="qhead">${q.head}</div>
        <div class="qsub">${q.sub}</div>
      </div>
      <div class="qc">
        <button class="ch yo" id="by" onclick="ans('y',${idx})">
          <span class="ce">${q.y.em}</span>
          <div><div class="ct">${q.y.t}</div><span class="cs">${q.y.s}</span></div>
        </button>
        <button class="ch no" id="bn" onclick="ans('n',${idx})">
          <span class="ce">${q.n.em}</span>
          <div><div class="ct">${q.n.t}</div><span class="cs">${q.n.s}</span></div>
        </button>
      </div>
    </div>
    <div class="eov" id="eov" data-s="${STYLES[idx]}" onclick="advance(${idx})">
      <div class="ei" id="ei"></div>
      <div class="et" id="et"></div>
      <div class="eb" id="eb"></div>
      <div class="epbar"><div class="epfill" id="epf"></div></div>
      <div class="eskip">${L[lang].skip[idx]}</div>
    </div>
  </div>`);
}

function advance(idx){
  clearTimeout(adv);
  idx<3?renderQ(idx+1):showFQ();
}

function ans(w,idx){
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by.disabled)return;
  by.disabled=true;bn.disabled=true;
  const btn=w==='y'?by:bn;
  btn.classList.add('rp');setTimeout(()=>btn.classList.remove('rp'),600);
  const q=L[lang].qs[idx];
  const ov=w==='y'?q.oy:q.on;
  if(w==='y'){
    by.classList.add('cy');bn.classList.add('fd');
    yCount++;
  } else {
    bn.classList.add('cn');by.classList.add('fd');
  }
  const el=document.getElementById('eov');
  document.getElementById('ei').textContent=ov.icon;
  document.getElementById('et').innerHTML=ov.t;
  document.getElementById('eb').innerHTML=ov.b;
  const st=el.dataset.s;
  setTimeout(()=>el.classList.add('show'),st==='card'||st==='wipe'?55:120);
  // fill bar triggers after show
  setTimeout(()=>{
    const f=document.getElementById('epf');
    if(f) requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width='100%'));
  },360);
  // auto-advance at 3.4s — enough time to read the empathy overlay
  adv=setTimeout(()=>advance(idx),3400);
}

function showFQ(){
  const fq=L[lang].fq;
  prog(PROG[5]);
  go(`<div class="screen fqs">
    <div class="qh">
      <div class="qdots">${[0,1,2,3].map(()=>'<div class="dot dn"></div>').join('')}</div>
      <div class="qnum">Final</div>
    </div>
    <div class="fqb">
      <div class="fqbadge">✦ ${fq.badge}</div>
      <div class="fqh">${fq.head}</div>
      <div class="fqlist">${fq.items.map(it=>`<div class="fqi"><div class="fqchk">✓</div>${it}</div>`).join('')}</div>
      <div class="fqend">${fq.end}<strong></strong></div>
      <div class="fqopts">${fq.opts.map((o,i)=>`<button class="fqbtn" id="fo${i}" onclick="ansFQ(${i})">${o.l}</button>`).join('')}</div>
      <div class="fqresp" id="fqr"></div>
    </div>
  </div>`);
}

function ansFQ(c){
  [0,1,2].forEach(i=>{const b=document.getElementById('fo'+i);if(b)b.disabled=true;});
  document.getElementById('fo'+c)?.classList.add('ch');
  [0,1,2].filter(i=>i!==c).forEach(i=>document.getElementById('fo'+i)?.classList.add('fd'));
  fqc=c;
  const r=document.getElementById('fqr');
  r.innerHTML=L[lang].fq.resp[c];r.style.display='block';
  setTimeout(()=>r.classList.add('show'),30);
  setTimeout(showReveal,3000);
}

    <div class="wp" id="ph3">

      <div class="feats">${r.feats.map((f,i)=>`<div class="feat" id="wf${i}"><span class="fi">${f.i}</span><span class="ft">${f.t}</span></div>`).join('')}</div>
      <div class="ctaw">
        <div class="ctag"></div>
        <a class="ctab" id="wcta" href="https://tendr.co.in" target="_blank">${r.cta}</a>

  setTimeout(()=>document.getElementById('ph1')?.classList.add('in'),100);
  r.pills.forEach((_,i)=>setTimeout(()=>document.getElementById('pl'+i)?.classList.add('in'),800+i*110));

    if(p){p.classList.remove('in');p.classList.add('out');}

    setTimeout(()=>{
      document.getElementById('ph3')?.classList.add('in');
      r.feats.forEach((_,i)=>setTimeout(()=>document.getElementById('wf'+i)?.classList.add('in'),300+i*140));
      setTimeout(()=>document.getElementById('wcta')?.classList.add('in'),1000);
    },480);
