<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09081A">
<title>Tendr — We Curate, You Celebrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#09081A;--sf:#0D0C22;--sf2:#13122C;
  --gold:#C89B3C;--gl:#EDBD5A;--gg:rgba(200,155,60,.3);--gls:rgba(200,155,60,.08);
  --txt:#EAE5DB;--dim:#6E6890;--muted:#3E3C58;
  --bdr:rgba(255,255,255,.07);--bdg:rgba(200,155,60,.22);
  --grn:#3ECF8E;--grng:rgba(62,207,142,.1);--grnb:rgba(62,207,142,.3);
  --font:'Plus Jakarta Sans',-apple-system,'SF Pro Display',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;}

/* ── AMBIENT ── */
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:orbf 16s ease-in-out infinite;}
.o1{width:420px;height:420px;background:radial-gradient(#C89B3C,transparent);top:-100px;left:-110px;opacity:.15;animation-delay:0s;}
.o2{width:320px;height:320px;background:radial-gradient(#5E35B1,transparent);bottom:20px;right:-80px;opacity:.12;animation-delay:-7s;}
.o3{width:240px;height:240px;background:radial-gradient(#C89B3C,transparent);bottom:38%;left:10%;opacity:.08;animation-delay:-12s;}
@keyframes orbf{0%,100%{transform:translate(0,0) scale(1);}40%{transform:translate(14px,-22px) scale(1.06);}70%{transform:translate(-8px,12px) scale(.94);}}
.ptcl{position:absolute;border-radius:50%;background:var(--gold);opacity:0;animation:ptf linear infinite;}
@keyframes ptf{0%{opacity:0;transform:translateY(0);}10%{opacity:.6;}88%{opacity:.1;}100%{opacity:0;transform:translateY(-130px);}}

/* ── SHELL ── */
#app{position:relative;z-index:1;height:100vh;height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#pb{position:fixed;top:0;left:0;right:0;height:2px;z-index:100;background:rgba(255,255,255,.04);}
#pf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gl));width:0%;transition:width .7s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px var(--gg);}

/* ── SCREEN ── */
.screen{position:absolute;width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;}

/* ── LANG SCREEN ── */
.ls{align-items:center;justify-content:center;padding:56px 28px;}
.tm{text-align:center;margin-bottom:52px;}
.tl{font-size:11px;font-weight:800;letter-spacing:6px;text-transform:uppercase;color:var(--txt);opacity:.35;display:block;margin-bottom:8px;}
.tt{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.6;}
.lhd{text-align:center;margin-bottom:40px;}
.lhp{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:16px;}
.lhh{font-size:32px;font-weight:900;color:var(--txt);line-height:1.18;margin-bottom:12px;}
.lhs{font-size:15px;color:var(--dim);line-height:1.75;}
.ll{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;text-align:center;}
.llist{display:flex;flex-direction:column;gap:10px;width:100%;}
.lb{display:flex;align-items:center;gap:18px;padding:20px 22px;background:var(--sf);border:1.5px solid var(--bdr);border-radius:18px;cursor:pointer;color:var(--txt);font-family:var(--font);transition:border-color .2s,background .2s,transform .15s;text-align:left;touch-action:manipulation;position:relative;overflow:hidden;}
.lb::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(200,155,60,.06) 60%,transparent 80%);transform:translateX(-100%);transition:transform .4s ease;}
.lb:hover::after{transform:translateX(100%);}
.lb:hover{border-color:var(--bdg);}
.lb:active{transform:scale(.97);}
.lf{font-size:26px;flex-shrink:0;}
.ln{font-size:17px;font-weight:800;display:block;}
.lsub{font-size:12px;color:var(--dim);margin-top:3px;display:block;}

/* ── QUESTION SCREEN ── */
.qs{background:transparent;}
.qtop{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px)+20px) 28px 0;flex-shrink:0;}
.qdots{display:flex;gap:7px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:all .45s cubic-bezier(.08,.9,.22,1);}
.dot.on{background:var(--gold);width:22px;border-radius:4px;box-shadow:0 0 10px var(--gg);}
.dot.dn{background:var(--gold);opacity:.3;}
.qnum{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);}

/* Question body: left-aligned, editorial */
.qbody{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 28px;}
.qcat{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.75;margin-bottom:18px;}
.qtxt{font-size:clamp(24px,6.2vw,30px);font-weight:900;color:var(--txt);line-height:1.22;margin-bottom:0;}
/* word-by-word reveal spans */
.qtxt .w{display:inline-block;opacity:0;transform:translateY(14px);will-change:opacity,transform;}
.qtxt .w.in{opacity:1;transform:translateY(0);}

/* Answers at bottom */
.qans{padding:0 20px calc(env(safe-area-inset-bottom,0px)+28px);display:flex;flex-direction:column;gap:12px;flex-shrink:0;}

/* Answer cards */
.ans{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:22px 22px;border-radius:20px;border:1.5px solid;
  cursor:pointer;font-family:var(--font);text-align:left;
  transition:transform .32s cubic-bezier(.15,1.5,.35,1),opacity .28s ease,border-color .2s,background .2s,box-shadow .28s;
  position:relative;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;width:100%;}
.ans:active{transform:scale(.97);}
.aem{font-size:28px;flex-shrink:0;transition:transform .35s cubic-bezier(.15,1.5,.35,1);}
.atxt{flex:1;}
.am{font-size:17px;font-weight:800;color:var(--txt);line-height:1.3;display:block;}
.as{font-size:12px;color:var(--dim);margin-top:3px;display:block;line-height:1.5;}
.abadge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;opacity:0;transform:scale(0);transition:opacity .25s,transform .3s cubic-bezier(.15,1.5,.35,1);flex-shrink:0;}

.yo{background:var(--grng);border-color:var(--grnb);}
.no{background:rgba(255,255,255,.03);border-color:var(--bdr);}

/* Selected states */
.ans.cy{background:rgba(62,207,142,.16);border-color:var(--grn);border-width:2px;transform:scale(1.02) translateY(-3px);box-shadow:0 0 0 1px rgba(62,207,142,.25),0 12px 40px rgba(62,207,142,.18);}
.ans.cy .am{color:var(--grn);}
.ans.cy .aem{transform:scale(1.25);}
.ans.cy .abadge{background:var(--grn);color:#09081A;opacity:1;transform:scale(1);}

.ans.cn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.45);border-width:2px;transform:scale(1.02) translateY(-3px);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 12px 40px rgba(255,255,255,.05);}
.ans.cn .aem{transform:scale(1.15);}
.ans.cn .abadge{background:rgba(255,255,255,.85);color:#09081A;opacity:1;transform:scale(1);}

.ans.fd{opacity:.07;transform:scale(0.96);pointer-events:none;}

/* ripple */
.ans::after{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.07);transform:scale(0);opacity:1;pointer-events:none;transition:transform .6s ease,opacity .6s ease;left:50%;top:50%;translate:-50% -50%;}
.ans.rp::after{transform:scale(2.5);opacity:0;}

/* ── EMPATHY SCREEN (replaces overlay — clean, readable) ── */
.emph{align-items:center;justify-content:center;padding:56px 36px calc(env(safe-area-inset-bottom,0px)+80px);}
.emph-wrap{text-align:center;max-width:320px;}
.emph-icon{font-size:54px;margin-bottom:24px;display:block;animation:epop .4s .05s cubic-bezier(.15,1.6,.35,1) both;}
@keyframes epop{from{transform:scale(0) rotate(-15deg);}to{transform:scale(1) rotate(0deg);}}
.emph-head{font-size:clamp(22px,5.5vw,26px);font-weight:900;color:var(--txt);line-height:1.25;margin-bottom:14px;}
.emph-head b{color:var(--gl);}
.emph-body{font-size:16px;color:var(--dim);line-height:1.78;}
.emph-foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+20px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;}
.emph-bar{width:180px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.emph-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gl));border-radius:2px;transition:width 3.2s linear;}
.emph-skip{font-size:12px;font-weight:700;color:var(--muted);padding:8px 16px;cursor:pointer;touch-action:manipulation;}

/* ── FINAL Q (mysterious) ── */
.fqs{align-items:center;justify-content:center;padding:0 32px;}
.fq-inner{width:100%;text-align:center;}
.fq-pre{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.65;margin-bottom:24px;}
.fq-big{font-size:clamp(22px,5.8vw,28px);font-weight:900;color:var(--txt);line-height:1.2;min-height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:48px;}
.fq-cycle{transition:opacity .3s ease,transform .3s ease;display:block;}
.fq-opts{display:flex;flex-direction:column;gap:12px;}
.fqbtn{width:100%;padding:20px 24px;border-radius:20px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;font-family:var(--font);font-size:16px;font-weight:700;color:var(--txt);transition:all .2s;text-align:center;touch-action:manipulation;}
.fqbtn:hover{border-color:var(--bdg);background:var(--gls);}
.fqbtn:active{transform:scale(.97);}
.fqbtn.sel{background:var(--gls);border-color:var(--gold);border-width:2px;color:var(--gl);}
.fqbtn.fd{opacity:.1;pointer-events:none;}
.fqresp{margin-top:18px;padding:18px 20px;background:linear-gradient(135deg,rgba(200,155,60,.12),rgba(200,155,60,.04));border:1.5px solid var(--bdg);border-radius:16px;font-size:15px;font-weight:600;color:var(--txt);line-height:1.65;display:none;text-align:center;animation:fu .3s ease both;}
.fqresp b{color:var(--gl);}
.fqresp.show{display:block;}

/* ── REVEAL ── */
.ws{position:relative;overflow:hidden;}
.wp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;opacity:0;pointer-events:none;transition:opacity .5s ease;overflow-y:auto;}
.wp.in{opacity:1;pointer-events:auto;}
.wp.out{opacity:0;pointer-events:none;}

/* ph1 – stat */
.sblk{text-align:center;}
.spre{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}
.sbig{font-size:min(22vw,108px);font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold),var(--gl),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:npop .55s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes npop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
.sin{font-size:clamp(22px,5vw,32px);font-weight:900;color:var(--txt);margin:6px 0;}
.ssub{font-size:16px;color:var(--dim);line-height:1.7;max-width:280px;margin:20px auto 0;}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px;max-width:310px;}
.pill{padding:7px 13px;border-radius:30px;background:var(--sf);border:1px solid var(--bdr);font-size:11px;font-weight:600;color:var(--dim);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;}
.pill.in{opacity:1;transform:translateY(0);}

/* ph2 – feature flash (one at a time, blur-slide from 21st.dev pattern) */
.ff{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 40px;text-align:center;pointer-events:none;}
.ff-num{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.5;margin-bottom:20px;transition:opacity .3s;}
.ff-em{font-size:52px;margin-bottom:22px;opacity:0;filter:blur(10px);transform:scale(.85);transition:opacity .5s ease,filter .5s ease,transform .5s cubic-bezier(.08,.9,.22,1);}
.ff-txt{font-size:clamp(26px,6.5vw,34px);font-weight:900;color:var(--txt);line-height:1.22;opacity:0;filter:blur(8px);transform:translateY(20px);transition:opacity .45s .08s ease,filter .45s .08s ease,transform .45s .08s cubic-bezier(.08,.9,.22,1);}
.ff.on .ff-em{opacity:1;filter:blur(0);transform:scale(1);}
.ff.on .ff-txt{opacity:1;filter:blur(0);transform:translateY(0);}
.ff.off .ff-em{opacity:0;filter:blur(8px);transform:scale(1.1);}
.ff.off .ff-txt{opacity:0;filter:blur(6px);transform:translateY(-14px);}

/* ph3 – converge grid → logo → CTA */
.conv{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:260px;margin-bottom:32px;
  transition:transform .6s cubic-bezier(.4,0,.8,0),opacity .45s ease;}
.conv.collapse{transform:scale(0);opacity:0;}
.cpill{padding:14px 16px;border-radius:14px;background:var(--sf);border:1px solid var(--bdg);
  font-size:13px;font-weight:700;color:var(--txt);text-align:center;line-height:1.35;
  opacity:0;transform:scale(.8);transition:opacity .4s,transform .4s cubic-bezier(.15,1.5,.35,1);}
.cpill.in{opacity:1;transform:scale(1);}
.cpill .ci{font-size:20px;display:block;margin-bottom:6px;}

.rlogo{width:min(150px,50vw);height:auto;opacity:0;transform:scale(.7);transition:opacity .55s,transform .55s cubic-bezier(.15,1.5,.35,1);}
.rlogo.in{opacity:1;transform:scale(1);}

.ctaw{position:relative;width:100%;margin-top:28px;}
.ctag{position:absolute;inset:-12px;border-radius:28px;background:radial-gradient(ellipse at 50% 50%,var(--gg),transparent 70%);animation:cpulse 2.8s 1s ease-in-out infinite;}
@keyframes cpulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:.65;transform:scale(1.06);}}
.ctab{display:flex;align-items:center;justify-content:center;width:100%;padding:22px 24px;
  background:linear-gradient(135deg,var(--gold),var(--gl));border:none;border-radius:20px;
  font-size:17px;font-weight:900;color:#09081A;cursor:pointer;font-family:var(--font);
  text-decoration:none;position:relative;overflow:hidden;box-shadow:0 4px 32px var(--gg);
  opacity:0;transition:opacity .5s,transform .15s;}
.ctab.in{opacity:1;}
.ctab:active{transform:scale(.97);}
.ctab::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);animation:sh 3s 1.5s infinite;}
@keyframes sh{0%,40%{transform:translateX(-200%);}100%{transform:translateX(200%);}}

/* ── UTILS ── */
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="amb"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="pb"><div id="pf"></div></div>
<div id="app"></div>

function prog(p){pf.style.width=p+'%';}

/* Slide transition */
function go(html,dir='right'){
  const prev=app.querySelector('.screen');
  const w=document.createElement('div');w.innerHTML=html;
  const next=w.firstElementChild;
  const tx=dir==='right'?'100%':'-100%';
  next.style.cssText=`transform:translateX(${tx}) scale(.96);opacity:0;`;
  app.appendChild(next);
  if(prev){
    prev.style.transition='transform .38s cubic-bezier(.4,0,.8,0),opacity .3s ease';
    prev.style.transform=dir==='right'?'translateX(-20%) scale(.96)':'translateX(20%) scale(.96)';
    prev.style.opacity='0';
    setTimeout(()=>prev.remove(),400);
  }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    next.style.transition='transform .44s cubic-bezier(.08,.9,.22,1),opacity .36s ease';
    next.style.transform='translateX(0) scale(1)';
    next.style.opacity='1';
  }));
}

function dots(a){
  return[0,1,2,3].map(i=>`<div class="dot${i===a?' on':i<a?' dn':''}"></div>`).join('');
}

/* Word-by-word reveal */
function revealWords(el){
  if(!el)return;
  const words=el.textContent.split(' ');
  el.innerHTML=words.map(w=>`<span class="w">${w} </span>`).join('');
  el.querySelectorAll('.w').forEach((s,i)=>{
    setTimeout(()=>s.classList.add('in'),i*55+80);
    s.style.transition=`opacity .4s ${i*.055+.08}s ease, transform .4s ${i*.055+.08}s cubic-bezier(.08,.9,.22,1)`;
  });
}

/* particles */
(function(){
  const amb=document.getElementById('amb');
  for(let i=0;i<14;i++){
    const p=document.createElement('div');p.className='ptcl';
    const s=Math.random()*2.5+1;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*55}%;animation-duration:${4+Math.random()*7}s;animation-delay:${Math.random()*9}s;`;
    amb.appendChild(p);
  }
})();

function setLang(l){lang=l;yCount=0;renderQ(0);}

/* ── QUESTION SCREEN ── */
function renderQ(idx){
  const q=L[lang].qs[idx];
  prog(PROG[idx+1]);
  go(`<div class="screen qs">
    <div class="qtop">
      <div class="qdots">${dots(idx)}</div>
      <div class="qnum">${idx+1} of 4</div>
    </div>
    <div class="qbody">
      <div class="qcat">${q.cat}</div>
      <div class="qtxt" id="qtxt">${q.q}</div>
    </div>
    <div class="qans">
      <button class="ans yo" id="by" onclick="ans('y',${idx})">
        <span class="aem">${q.y.em}</span>
        <span class="atxt"><span class="am">${q.y.m}</span><span class="as">${q.y.s}</span></span>
        <span class="abadge">✓</span>
      </button>
      <button class="ans no" id="bn" onclick="ans('n',${idx})">
        <span class="aem">${q.n.em}</span>
        <span class="atxt"><span class="am">${q.n.m}</span><span class="as">${q.n.s}</span></span>
        <span class="abadge">✓</span>
      </button>
    </div>
  </div>`);
  revealWords(document.getElementById('qtxt'));
}

function ans(w,idx){
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(!by||by.disabled)return;
  by.disabled=true;bn.disabled=true;
  const btn=w==='y'?by:bn;
  btn.classList.add('rp');
  if(w==='y'){by.classList.add('cy');bn.classList.add('fd');yCount++;}
  else{bn.classList.add('cn');by.classList.add('fd');}
  setTimeout(()=>showEmpathy(idx,w),600);
}

/* ── EMPATHY SCREEN (separate, clean, readable) ── */
function showEmpathy(idx,w){
  const q=L[lang].qs[idx];
  const ov=w==='y'?q.oy:q.on;
  prog(PROG[idx+1]+4);

  go(`<div class="screen emph">
    <div class="emph-wrap">
      <span class="emph-icon">${ov.icon}</span>
      <div class="emph-head" style="animation:fu .4s .15s ease both">${ov.h}</div>
      <div class="emph-body" style="animation:fu .4s .28s ease both">${ov.b}</div>
    </div>
    <div class="emph-foot">
      <div class="emph-bar"><div class="emph-fill" id="efill"></div></div>
      <div class="emph-skip" onclick="doAdvance(${idx})">${L[lang].skip[idx]}</div>
    </div>
  </div>`);

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const f=document.getElementById('efill');
    if(f)f.style.width='100%';
  }));
  advTimer=setTimeout(()=>doAdvance(idx),3400);
}

function doAdvance(idx){
  clearTimeout(advTimer);
  idx<3?renderQ(idx+1):showFQ();
}

/* ── FINAL Q (mysterious cycling) ── */
function showFQ(){
  const fq=L[lang].fq;
  prog(PROG[5]);
  go(`<div class="screen fqs">
    <div class="fq-inner">
      <div class="fq-pre" style="animation:fu .5s ease both">${fq.pre}</div>
      <div class="fq-big" style="animation:fu .5s .15s ease both">
        <span class="fq-cycle" id="fqc">${L[lang].fqcycle[0]}</span>
      </div>
      <div class="fq-opts" style="animation:fu .5s .3s ease both">
        ${fq.opts.map((o,i)=>`<button class="fqbtn" id="fo${i}" onclick="ansFQ(${i})">${o.l}</button>`).join('')}
      </div>
      <div class="fqresp" id="fqr"></div>
    </div>
  </div>`);

  /* cycle through questions */
  let ci=0;
  fqTimer=setInterval(()=>{
    const el=document.getElementById('fqc');
    if(!el){clearInterval(fqTimer);return;}
    el.style.opacity='0';el.style.transform='translateY(-10px)';
    setTimeout(()=>{
      ci=(ci+1)%L[lang].fqcycle.length;
      if(!el.isConnected){clearInterval(fqTimer);return;}
      el.textContent=L[lang].fqcycle[ci];
      el.style.opacity='1';el.style.transform='translateY(0)';
    },300);
  },2400);
}

function ansFQ(c){
  clearInterval(fqTimer);
  [0,1].forEach(i=>{const b=document.getElementById('fo'+i);if(b)b.disabled=true;});
  document.getElementById('fo'+c)?.classList.add('sel');
  [0,1].filter(i=>i!==c).forEach(i=>document.getElementById('fo'+i)?.classList.add('fd'));
  const r=document.getElementById('fqr');
  r.innerHTML=L[lang].fq.resp[c];r.style.display='block';
  setTimeout(()=>r.classList.add('show'),20);
  setTimeout(showReveal,2600);
}

  setTimeout(()=>{
    const p=document.getElementById('ph1');
    if(p){p.classList.remove('in');p.classList.add('out');}
    setTimeout(()=>startFlash(rv),500);

/* Feature flash — blur-slide in/out, one at a time */
function startFlash(rv){
  const ph2=document.getElementById('ph2');
  if(!ph2)return;
  ph2.classList.add('in');

  const feats=rv.feats;
  let fi=0;

  const showFeature=()=>{
    const ff=document.getElementById('ff');
    const em=document.getElementById('ffem');
    const tx=document.getElementById('fftxt');
    const nm=document.getElementById('ffnum');
    if(!ff||!em||!tx)return;

    /* set content */
    em.textContent=feats[fi].i;
    tx.textContent=feats[fi].t.replace('.','');
    nm.textContent=`${fi+1} of ${feats.length}`;

    /* blur-in */
    ff.classList.remove('off');
    requestAnimationFrame(()=>requestAnimationFrame(()=>ff.classList.add('on')));

    /* hold then blur-out */
    setTimeout(()=>{
      ff.classList.remove('on');
      ff.classList.add('off');
      setTimeout(()=>{
        fi++;
        if(fi<feats.length){
          showFeature();
        } else {
          /* ph2 → ph3 */
          ph2.classList.remove('in');ph2.classList.add('out');
          setTimeout(startConverge,500);
        }
      },380);
    },1500);
  };

  showFeature();
}

/* Converge grid → Logo → CTA */
function startConverge(){
  const ph3=document.getElementById('ph3');
  const conv=document.getElementById('conv');
  if(!ph3)return;
  ph3.classList.add('in');

  /* stagger pills in */
  [0,1,2,3].forEach(i=>setTimeout(()=>document.getElementById('cp'+i)?.classList.add('in'),i*120));

  /* collapse grid after 2s */
  setTimeout(()=>{
    if(conv)conv.classList.add('collapse');
    /* logo appears */
    setTimeout(()=>{
      document.querySelector('.rlogo')?.classList.add('in');
      /* CTA appears */
      setTimeout(()=>document.getElementById('wcta')?.classList.add('in'),900);
    },500);
  },2200);
}
