<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070C">
<title>Tendr — We Curate, You Celebrate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070C;--s1:#0E0E18;
  --gold:#C89B3C;--gl:#EDBD5A;--gp:rgba(200,155,60,.09);
  --text:#EAE5DB;--muted:#58546B;--dim:#1E1C2A;
  --grn:#3ECF8E;--grn-bg:rgba(62,207,142,.07);--grn-b:rgba(62,207,142,.22);
}
html,body{
  height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
#app{height:100vh;height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.screen{
  position:absolute;width:100%;max-width:430px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .28s ease;will-change:transform,opacity;
}
.from-r{transform:translateX(100%);}
.active{transform:translateX(0)!important;opacity:1!important;}
.to-l{transform:translateX(-24%);opacity:0;}

/* lang */
.lang-scr{background:var(--bg);justify-content:center;align-items:center;padding:44px 30px;}
.logo{font-size:20px;font-weight:900;letter-spacing:3px;color:var(--text);margin-bottom:44px;text-align:center;}
.logo span{color:var(--gold);}
.pre{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;text-align:center;}
.main-h{font-size:30px;font-weight:900;color:var(--text);line-height:1.2;margin-bottom:8px;text-align:center;}
.main-s{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:40px;text-align:center;}
.lang-lbl{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);margin-bottom:12px;text-align:center;align-self:stretch;}
.lang-list{display:flex;flex-direction:column;gap:10px;width:100%;}
.lang-btn{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--s1);border:1.5px solid rgba(200,155,60,.13);border-radius:16px;cursor:pointer;color:var(--text);font-family:inherit;transition:border-color .15s,background .15s;text-align:left;touch-action:manipulation;}
.lang-btn:hover{border-color:rgba(200,155,60,.38);background:#131320;}
.lang-btn:active{transform:scale(.98);}
.lf{font-size:24px;flex-shrink:0;}
.ln{font-size:17px;font-weight:800;}
.ls{font-size:12px;color:var(--muted);margin-top:2px;}

/* question */
.q-scr{background:var(--bg);overflow:hidden;}
.q-prog{padding:28px 30px 0;display:flex;justify-content:center;gap:8px;flex-shrink:0;}
.pd{width:6px;height:6px;border-radius:50%;background:var(--dim);transition:all .3s;}
.pd.on{background:var(--gold);width:22px;border-radius:3px;}
.q-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 28px 36px;}
.q-body{text-align:center;margin-bottom:24px;}
.q-step{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;}
.q-head{font-size:25px;font-weight:900;color:var(--text);line-height:1.28;margin-bottom:14px;}
.q-sub{font-size:14px;color:#8A859E;line-height:1.72;max-width:300px;margin:0 auto;}
.q-foot{display:flex;flex-direction:column;gap:0;}
.yn-wrap{display:flex;flex-direction:column;gap:10px;}
.yn{width:100%;padding:17px 20px;border-radius:16px;border:1.5px solid;cursor:pointer;font-family:inherit;text-align:left;display:flex;align-items:center;gap:14px;transition:all .18s;color:var(--text);font-size:15px;font-weight:700;touch-action:manipulation;}
.yn:active{transform:scale(.98);}
.y-opt{background:var(--grn-bg);border-color:var(--grn-b);}
.n-opt{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);}
.yn.chosen-y{background:rgba(62,207,142,.15);border-color:var(--grn);color:var(--grn);}
.yn.chosen-n{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);}
.yn.faded{opacity:.14;pointer-events:none;}
.yn-em{display:none;}
.emp{margin-top:12px;padding:14px 16px;background:var(--gp);border:1px solid rgba(200,155,60,.18);border-radius:14px;font-size:14px;color:var(--muted);line-height:1.65;display:none;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;}
.emp.show{opacity:1;transform:translateY(0);}
.emp b{color:var(--gl);font-weight:700;}

/* ── Empathy overlay base ── */
.eov{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:44px 32px 80px;text-align:center;
  opacity:0;pointer-events:none;
}
.eov.show{pointer-events:auto;}
.eov-txt{font-size:22px;font-weight:800;color:var(--text);line-height:1.5;max-width:320px;}
.eov-txt b{color:var(--gl);}
.eov-sub{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.6;max-width:290px;}
.eov-bar{position:absolute;bottom:44px;left:32px;right:32px;height:2px;background:var(--dim);border-radius:2px;overflow:hidden;}
.eov-fill{height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width 2.6s linear;}
.eov-skip{
  position:absolute;bottom:14px;right:20px;
  font-size:11px;font-weight:700;letter-spacing:.5px;
  color:var(--muted);padding:10px 14px;cursor:pointer;
  opacity:0;transition:opacity .3s;touch-action:manipulation;
}
.eov.show .eov-skip{opacity:1;}
.eov.show{cursor:pointer;}

/* ── Q1: gentle crossfade ── */
.eov[data-style="fade"]{background:var(--bg);transition:opacity .42s ease;}
.eov[data-style="fade"].show{opacity:1;}

/* ── Q2: bottom sheet slides up ── */
.eov[data-style="card"]{
  top:auto;min-height:62%;
  background:var(--s1);
  align-items:flex-start;text-align:left;
  padding:34px 28px 80px;
  opacity:1;transform:translateY(104%);
  transition:transform .46s cubic-bezier(.08,.9,.22,1);
  border-radius:22px 22px 0 0;
  border-top:1.5px solid rgba(200,155,60,.22);
  box-shadow:0 -14px 56px rgba(0,0,0,.78);
}
.eov[data-style="card"].show{transform:translateY(0);}
.eov[data-style="card"] .eov-txt{font-size:19px;padding-left:14px;border-left:3px solid var(--gold);}
.eov[data-style="card"] .eov-sub{padding-left:17px;}

/* ── Q3: top sheet drops down from above ── */
.eov[data-style="wipe"]{
  bottom:auto;min-height:60%;
  background:var(--s1);
  align-items:flex-start;text-align:left;
  padding:56px 28px 36px;
  opacity:1;transform:translateY(-104%);
  transition:transform .46s cubic-bezier(.08,.9,.22,1);
  border-radius:0 0 22px 22px;
  border-bottom:1.5px solid rgba(200,155,60,.22);
  box-shadow:0 14px 56px rgba(0,0,0,.78);
}
.eov[data-style="wipe"].show{transform:translateY(0);}
.eov[data-style="wipe"] .eov-txt{font-size:19px;padding-left:14px;border-left:3px solid var(--gold);}
.eov[data-style="wipe"] .eov-sub{padding-left:17px;}

/* ── Q4: scale-punch with spring + amber glow ── */
.eov[data-style="punch"]{
  background:radial-gradient(ellipse at 50% 44%,rgba(200,155,60,.2) 0%,rgba(210,85,30,.08) 40%,var(--bg) 68%);
  transform:scale(.78);
  transition:opacity .18s ease,transform .38s cubic-bezier(.15,1.6,.35,1);
}
.eov[data-style="punch"].show{opacity:1;transform:scale(1);}
.eov[data-style="punch"] .eov-txt{font-size:26px;}

.prog-bar{margin-top:12px;height:2px;background:var(--dim);border-radius:2px;overflow:hidden;display:none;}
.prog-bar.show{display:block;}
.prog-fill{height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width 3s linear;}
.q-bad-list{display:flex;flex-direction:column;gap:10px;margin:0 auto;text-align:left;max-width:290px;}
.q-bad-item{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;font-weight:600;color:#8A859E;line-height:1.4;}
.q-bad-x{flex-shrink:0;font-size:14px;margin-top:1px;}

/* ── final question (Screen 5) ── */
.fq-scr{background:var(--bg);}
.fq-mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 28px 28px;}
.fq-top{text-align:center;margin-bottom:20px;}
.fq-step{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}
.fq-head{font-size:22px;font-weight:900;color:var(--text);line-height:1.3;margin-bottom:16px;}
.fq-list{display:flex;flex-direction:column;gap:7px;align-items:center;margin-bottom:14px;}
.fq-item{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:700;color:var(--text);}
.fq-chk{font-size:13px;color:var(--gold);font-weight:900;width:16px;text-align:center;}
.fq-end{font-size:15px;color:var(--muted);text-align:center;line-height:1.6;margin-top:10px;}
.fq-end b{color:var(--text);font-size:20px;font-weight:900;display:block;margin-top:6px;}
.fq-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:0;}
.fq-opt{
  width:100%;padding:16px 22px;border-radius:16px;
  border:1.5px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.03);
  cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;
  color:var(--text);transition:all .18s;text-align:center;touch-action:manipulation;
}
.fq-opt:active{transform:scale(.98);}
.fq-opt:hover{border-color:rgba(200,155,60,.35);background:rgba(200,155,60,.06);}
.fq-opt.chosen{background:var(--gp);border-color:var(--gold);color:var(--gl);}
.fq-opt.faded{opacity:.14;pointer-events:none;}

/* ── wow reveal (3-phase) ── */
.wow-scr{background:var(--bg);position:relative;overflow:hidden;}
.wp{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 30px;
  opacity:0;transition:opacity .5s ease;pointer-events:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.wp.in{opacity:1;pointer-events:auto;}
.wp.out{opacity:0;pointer-events:none;}

/* Phase 1: the 6 */
.wow-num{
  font-size:120px;font-weight:900;color:var(--gold);
  line-height:1;text-align:center;
  text-shadow:0 0 60px rgba(200,155,60,.35);
  animation:numPop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes numPop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
.wow-num-sub{
  font-size:15px;color:var(--muted);text-align:center;
  margin-top:10px;letter-spacing:.3px;
  opacity:0;transition:opacity .4s .3s;
}
.wp.in .wow-num-sub{opacity:1;}
.wow-pills{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;margin-top:28px;max-width:320px;
}
.wow-pill{
  padding:8px 14px;border-radius:30px;
  background:var(--s1);border:1px solid rgba(255,255,255,.08);
  font-size:12px;font-weight:600;color:var(--muted);
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;
}
.wow-pill.in{opacity:1;transform:translateY(0);}

/* Phase 2: pivot */
.wow-opener{
  font-size:14px;color:var(--muted);text-align:center;
  margin-bottom:20px;letter-spacing:.3px;
  opacity:0;transition:opacity .5s .1s;
}
.wp.in .wow-opener{opacity:1;}
.wow-pivot-big{
  font-size:30px;font-weight:900;color:var(--text);
  text-align:center;line-height:1.25;
  opacity:0;transform:translateY(12px);
  transition:opacity .5s .3s,transform .5s .3s;
}
.wow-pivot-big em{color:var(--gold);font-style:normal;}
.wp.in .wow-pivot-big{opacity:1;transform:translateY(0);}

/* Phase 3: Tendr reveal */
.wow-tendr-logo{
  display:block;margin:0 auto 20px;
  width:min(190px,65vw);height:auto;
  opacity:0;transform:scale(.85);
  transition:opacity .55s,transform .55s;
  flex-shrink:0;
}
.wp.in .wow-tendr-logo{opacity:1;transform:scale(1);}
.wow-feats{display:flex;flex-direction:column;gap:9px;width:100%;margin-bottom:24px;}
.wow-feat{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;background:var(--gp);
  border:1px solid rgba(200,155,60,.17);border-radius:13px;
  opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;
}
.wow-feat.in{opacity:1;transform:translateY(0);}
.wf-i{font-size:18px;flex-shrink:0;}
.wf-t{font-size:14px;font-weight:700;color:var(--text);}
.wow-cta-btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;padding:20px;background:var(--gold);border:none;
  border-radius:16px;font-size:16px;font-weight:900;color:#07070C;
  cursor:pointer;font-family:inherit;text-decoration:none;
  position:relative;overflow:hidden;transition:transform .15s;
  opacity:0;transition:opacity .5s;
}
.wow-cta-btn.in{opacity:1;}
.wow-cta-btn:active{transform:scale(.98);}
.wow-cta-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);animation:sheen 2.6s 1s infinite;}
@keyframes sheen{0%,55%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
@keyframes pop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
</style>
</head>

let lang='en', wowChoice=0, advanceTimer=null;
const app=document.getElementById('app');

function go(html){
  const prev=app.querySelector('.screen');
  const d=document.createElement('div');d.innerHTML=html;
  const next=d.firstElementChild;
  next.classList.add('from-r');
  app.appendChild(next);
  if(prev){prev.classList.add('to-l');setTimeout(()=>prev.remove(),450);}
  requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.add('active')));
}

function langScreen(){
  go(`<div class="screen lang-scr">
    <div style="width:100%">
      <div class="logo">TEN<span>D</span>R</div>
      <div class="pre">Before we introduce ourselves</div>
      <div class="main-h">5 quick questions.<br>Less than 30 seconds.</div>
      <div class="main-s">No sign-up. No catch.<br>Just a quick conversation.</div>
      <div class="lang-lbl">Choose your language</div>
      <div class="lang-list">
        <button class="lang-btn" onclick="setLang('en')"><div><div class="ln">English</div><div class="ls">Continue in English</div></div></button>
        <button class="lang-btn" onclick="setLang('hi')"><div><div class="ln">हिन्दी</div><div class="ls">हिंदी में चलते हैं</div></div></button>
        <button class="lang-btn" onclick="setLang('hl')"><div><div class="ln">Hinglish</div><div class="ls">Mix karke chalte hain bhai</div></div></button>
      </div>
    </div>
  </div>`);
}
function setLang(l){lang=l;renderQ(0);}

function dots(i){
  return[0,1,2,3].map(n=>`<div class="pd${n===i?' on':''}"></div>`).join('');
}

const EOV_STYLES=['fade','card','wipe','punch'];
function renderQ(idx){
  const q=L[lang].qs[idx];
  go(`<div class="screen q-scr">
    <div class="q-prog">${dots(idx)}</div>
    <div class="q-mid">
      <div class="q-body">
        <div class="q-step">${q.step}</div>
        <div class="q-head">${q.head}</div>
        ${q.subHtml
          ? `<div class="q-bad-list">${q.subHtml}</div>`
          : `<div class="q-sub">${q.sub}</div>`}
      </div>
      <div class="q-foot">
        <div class="yn-wrap">
          <button class="yn y-opt" id="by" onclick="answer('y',${idx})"><span class="yn-em">${q.y.em}</span><span>${q.y.t}</span></button>
          <button class="yn n-opt" id="bn" onclick="answer('n',${idx})"><span class="yn-em">${q.n.em}</span><span>${q.n.t}</span></button>
        </div>
      </div>
    </div>
    <div class="eov" id="eov" data-style="${EOV_STYLES[idx]}" onclick="advance(${idx})">
      <div class="eov-txt" id="eov-txt"></div>
      <div class="eov-sub" id="eov-sub"></div>
      <div class="eov-bar"><div class="eov-fill" id="eov-fill"></div></div>
      <div class="eov-skip">${L[lang].skipLabels[idx]}</div>
    </div>
  </div>`);
}

function advance(idx){
  clearTimeout(advanceTimer);
  if(idx<3)renderQ(idx+1);else showFinalQ();
}

function answer(which,idx){
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by.disabled)return;
  by.disabled=true;bn.disabled=true;
  const q=L[lang].qs[idx];
  const d=which==='y'?q.y:q.n;
  if(which==='y'){by.classList.add('chosen-y');bn.classList.add('faded');}
  else{bn.classList.add('chosen-n');by.classList.add('faded');}

  const ov=document.getElementById('eov');
  const ovTxt=document.getElementById('eov-txt');
  const ovSub=document.getElementById('eov-sub');
  const ovFill=document.getElementById('eov-fill');

  const parts=d.msg.split('||');
  ovTxt.innerHTML=parts[0].trim();
  ovSub.innerHTML=(parts[1]||'').trim();
  ovSub.style.display=parts[1]?'block':'none';

  const style=ov.dataset.style;
  const delay=(style==='card'||style==='wipe')?50:120;
  setTimeout(()=>ov.classList.add('show'),delay);
  setTimeout(()=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ovFill.style.width='100%';}));
  },350);
  advanceTimer=setTimeout(()=>advance(idx),3000);
}

function showFinalQ(){
  const fq=L[lang].finalQ;
  go(`<div class="screen fq-scr">
    <div class="q-prog">${[0,1,2,3].map(()=>`<div class="pd on"></div>`).join('')}</div>
    <div class="fq-mid">
      <div class="fq-top">
        <div class="fq-step">${fq.step}</div>
        <div class="fq-head">${fq.head}</div>
        <div class="fq-list">
          ${fq.items.map(it=>`<div class="fq-item"><span class="fq-chk">✓</span>${it}</div>`).join('')}
        </div>
        <div class="fq-end">${fq.end}</div>
      </div>
      <div class="fq-opts">
        ${fq.opts.map((o,i)=>`<button class="fq-opt" id="fo${i}" onclick="answerFQ(${i})">${o.label}</button>`).join('')}
      </div>
      <div class="emp" id="emp" style="margin-top:12px"></div>
      <div class="prog-bar" id="pbar" style="margin-top:12px"><div class="prog-fill" id="pfill"></div></div>
    </div>
  </div>`);
}

function answerFQ(choice){
  [0,1,2].forEach(i=>{const b=document.getElementById('fo'+i);if(b)b.disabled=true;});
  document.getElementById('fo'+choice)?.classList.add('chosen');
  [0,1,2].filter(i=>i!==choice).forEach(i=>document.getElementById('fo'+i)?.classList.add('faded'));
  wowChoice=choice;
  const fq=L[lang].finalQ;
  const emp=document.getElementById('emp');
  emp.innerHTML=fq.opts[choice].resp;emp.style.display='block';
  setTimeout(()=>emp.classList.add('show'),60);
  const bar=document.getElementById('pbar'),fill=document.getElementById('pfill');
  setTimeout(()=>{
    bar.classList.add('show');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.width='100%';}));
  },300);
  setTimeout(()=>showReveal(),3400);
}

</svg>`;

function showReveal(){
  const r=L[lang].rev;
  const fq=L[lang].finalQ;
  const opener=fq.opts[wowChoice]?.opener||fq.opts[0].opener;

  go(`<div class="screen wow-scr">
    <div class="wp" id="ph1">
      <div class="wow-num" id="wnum">1</div>
      <div class="wow-num-sub">${r.numSub}</div>
      <div class="wow-pills">
        ${r.pills.map((p,i)=>`<div class="wow-pill" id="pill${i}">${p}</div>`).join('')}
      </div>
    </div>
    <div class="wp" id="ph2">
      <div class="wow-opener">${opener}</div>
      <div class="wow-pivot-big">What if it was just <em>one?</em></div>
    </div>
    <div class="wp" id="ph3">
      ${LOGO_SVG}
      <div class="wow-feats">
        ${r.feats.map((f,i)=>`<div class="wow-feat" id="wf${i}"><span class="wf-i">${f.i}</span><span class="wf-t">${f.t}</span></div>`).join('')}
      </div>
      <a class="wow-cta-btn" id="wcta" href="https://tendr.co.in" target="_blank">${r.cta}</a>
    </div>
  </div>`);

  setTimeout(()=>document.getElementById('ph1')?.classList.add('in'),80);

  let n=1;
  const countEl=document.getElementById('wnum');
  const ci=setInterval(()=>{
    n++;if(countEl)countEl.textContent=n;
    if(n>=6)clearInterval(ci);
  },180);

  setTimeout(()=>{
    r.pills.forEach((_,i)=>setTimeout(()=>document.getElementById('pill'+i)?.classList.add('in'),i*120));
  },600);

  setTimeout(()=>{
    const p1=document.getElementById('ph1');
    if(p1){p1.classList.remove('in');p1.classList.add('out');}
    setTimeout(()=>document.getElementById('ph2')?.classList.add('in'),480);
  },3600);

  setTimeout(()=>{
    const p2=document.getElementById('ph2');
    if(p2){p2.classList.remove('in');p2.classList.add('out');}
    setTimeout(()=>{
      document.getElementById('ph3')?.classList.add('in');
      r.feats.forEach((_,i)=>setTimeout(()=>document.getElementById('wf'+i)?.classList.add('in'),280+i*130));
      setTimeout(()=>document.getElementById('wcta')?.classList.add('in'),900);
    },480);
  },6000);
}

langScreen();
