<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09081A">
<title>Tendr — We Curate, You Celebrate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#09081A;--sf:#0F0E24;--sf2:#141330;
  --gold:#C89B3C;--gl:#EDBD5A;--gg:rgba(200,155,60,.32);--gls:rgba(200,155,60,.08);
  --txt:#EAE5DB;--dim:#7A7590;--muted:#4A4660;
  --bdr:rgba(255,255,255,.07);--bdg:rgba(200,155,60,.2);
  --grn:#3ECF8E;--grng:rgba(62,207,142,.08);--grnb:rgba(62,207,142,.26);
}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  overflow:hidden;}

/* ── AMBIENT ── */
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);
  animation:orbf 14s ease-in-out infinite;}
.o1{width:340px;height:340px;background:radial-gradient(#C89B3C,transparent);
  top:-80px;left:-90px;opacity:.16;animation-delay:0s;}
.o2{width:280px;height:280px;background:radial-gradient(#6C3FC7,transparent);
  bottom:40px;right:-70px;opacity:.13;animation-delay:-6s;}
.o3{width:200px;height:200px;background:radial-gradient(#C89B3C,transparent);
  bottom:35%;left:15%;opacity:.09;animation-delay:-10s;}
@keyframes orbf{0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(16px,-20px) scale(1.07);}
  66%{transform:translate(-10px,13px) scale(.95);}}
.ptcl{position:absolute;border-radius:50%;background:var(--gold);
  opacity:0;animation:ptf linear infinite;}
@keyframes ptf{0%{opacity:0;transform:translateY(0);}
  12%{opacity:.55;}90%{opacity:.15;}100%{opacity:0;transform:translateY(-110px);}}

/* ── SHELL ── */
#app{position:relative;z-index:1;height:100vh;height:100dvh;
  width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* ── PROGRESS ── */
#pb{position:fixed;top:0;left:0;right:0;height:2.5px;z-index:100;background:rgba(255,255,255,.05);}
#pf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gl));width:0%;
  transition:width .65s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px var(--gg);}

/* ── SCREEN ── */
.screen{position:absolute;width:100%;max-width:440px;
  height:100vh;height:100dvh;display:flex;flex-direction:column;}

/* ── LANG ── */
.ls{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:48px 28px;gap:0;}
.tm{margin-bottom:44px;text-align:center;}
.tl{font-size:12px;font-weight:900;letter-spacing:6px;text-transform:uppercase;
  color:var(--txt);opacity:.45;display:block;margin-bottom:6px;}
.tt{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);opacity:.65;}
.lh{text-align:center;margin-bottom:36px;animation:fu .5s ease both;}
.lhp{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;}
.lhh{font-size:28px;font-weight:900;color:var(--txt);line-height:1.22;margin-bottom:10px;}
.lhs{font-size:14px;color:var(--dim);line-height:1.7;}
.ll{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;text-align:center;}
.llist{display:flex;flex-direction:column;gap:10px;width:100%;}
.lb{display:flex;align-items:center;gap:16px;padding:18px 22px;
  background:var(--sf);border:1.5px solid var(--bdr);border-radius:18px;
  cursor:pointer;color:var(--txt);font-family:inherit;
  transition:border-color .2s,background .2s,transform .15s;
  text-align:left;touch-action:manipulation;position:relative;overflow:hidden;}
.lb::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(200,155,60,.06) 60%,transparent 80%);
  transform:translateX(-100%);transition:transform .4s ease;}
.lb:hover::after{transform:translateX(100%);}
.lb:hover{border-color:var(--bdg);background:var(--sf2);}
.lb:active{transform:scale(.97);}
.lf{font-size:26px;flex-shrink:0;}
.ln{font-size:17px;font-weight:800;display:block;}
.lsub{font-size:12px;color:var(--dim);margin-top:2px;display:block;}

/* ── QUESTION ── */
.qs{background:transparent;}
.qh{padding:calc(env(safe-area-inset-top,0px) + 20px) 24px 0;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.qdots{display:flex;gap:7px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--sf2);
  transition:all .4s cubic-bezier(.08,.9,.22,1);}
.dot.on{background:var(--gold);width:24px;border-radius:4px;box-shadow:0 0 10px var(--gg);}
.dot.dn{background:var(--gold);opacity:.35;}
.qnum{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);}
.qb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 28px 20px;}
.qbadge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:30px;
  background:var(--gls);border:1px solid var(--bdg);
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin-bottom:20px;align-self:flex-start;
  animation:fu .4s .05s ease both;}
.qhead{font-size:clamp(19px,5.2vw,25px);font-weight:900;color:var(--txt);
  line-height:1.25;margin-bottom:12px;animation:fu .4s .1s ease both;}
.qhead em{color:var(--gl);font-style:normal;}
.qsub{font-size:14px;color:var(--dim);line-height:1.7;animation:fu .4s .15s ease both;}
.qc{padding:0 20px calc(env(safe-area-inset-bottom,24px) + 20px);
  display:flex;flex-direction:column;gap:11px;flex-shrink:0;
  animation:fu .4s .22s ease both;}
.ch{display:flex;align-items:center;gap:13px;padding:17px 20px;border-radius:18px;
  border:1.5px solid;cursor:pointer;font-family:inherit;text-align:left;
  transition:all .2s;position:relative;overflow:hidden;touch-action:manipulation;}
.ch:active{transform:scale(.97);}
.ce{font-size:22px;flex-shrink:0;transition:transform .3s;}
.ct{font-size:15px;font-weight:700;color:var(--txt);}
.cs{font-size:12px;color:var(--dim);margin-top:2px;display:block;}
.yo{background:var(--grng);border-color:var(--grnb);}
.yo:hover{background:rgba(62,207,142,.13);border-color:rgba(62,207,142,.4);}
.no{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.09);}
.no:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);}
.ch.cy{background:rgba(62,207,142,.14);border-color:var(--grn);
  box-shadow:0 0 24px rgba(62,207,142,.15);}
.ch.cy .ct{color:var(--grn);}
.ch.cy .ce{transform:scale(1.2);}
.ch.cn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22);}
.ch.fd{opacity:.12;pointer-events:none;}
/* ripple */
.ch::after{content:'';position:absolute;width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.08);transform:scale(0);opacity:1;
  pointer-events:none;transition:transform .5s ease,opacity .5s ease;
  left:50%;top:50%;translate:-50% -50%;}
.ch.rp::after{transform:scale(2.2);opacity:0;}

/* ── EMPATHY OVERLAY ── */
.eov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 32px 80px;
  pointer-events:none;}
.eov.show{pointer-events:auto;}
.eov[data-s="fade"]{background:linear-gradient(180deg,var(--bg),var(--sf));
  opacity:0;transition:opacity .35s ease;}
.eov[data-s="fade"].show{opacity:1;}
.eov[data-s="card"]{top:auto;min-height:54%;background:var(--sf);
  align-items:flex-start;text-align:left;padding:36px 28px 80px;
  opacity:1;transform:translateY(112%);
  transition:transform .48s cubic-bezier(.08,.9,.22,1);
  border-radius:24px 24px 0 0;border-top:1.5px solid var(--bdg);
  box-shadow:0 -20px 60px rgba(0,0,0,.75);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.eov[data-s="card"].show{transform:translateY(0);}
.eov[data-s="wipe"]{bottom:auto;min-height:52%;background:var(--sf);
  align-items:flex-start;text-align:left;padding:58px 28px 36px;
  opacity:1;transform:translateY(-112%);
  transition:transform .48s cubic-bezier(.08,.9,.22,1);
  border-radius:0 0 24px 24px;border-bottom:1.5px solid var(--bdg);
  box-shadow:0 20px 60px rgba(0,0,0,.75);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.eov[data-s="wipe"].show{transform:translateY(0);}
.eov[data-s="punch"]{background:radial-gradient(ellipse 60% 50% at 50% 44%,
  rgba(200,155,60,.16),transparent);
  opacity:0;transform:scale(.8);
  transition:opacity .2s ease,transform .4s cubic-bezier(.15,1.6,.35,1);}
.eov[data-s="punch"].show{opacity:1;transform:scale(1);}
.ei{font-size:38px;margin-bottom:16px;
  animation:ipop .4s .1s cubic-bezier(.15,1.6,.35,1) both;}
@keyframes ipop{from{transform:scale(0);}to{transform:scale(1);}}
.et{font-size:20px;font-weight:900;color:var(--txt);line-height:1.4;margin-bottom:10px;}
.et b{color:var(--gl);}
.eb{font-size:14px;color:var(--dim);line-height:1.7;max-width:300px;}
.eov[data-s="card"] .et,.eov[data-s="wipe"] .et{
  font-size:18px;padding-left:16px;border-left:3px solid var(--gold);}
.eov[data-s="card"] .eb,.eov[data-s="wipe"] .eb{padding-left:19px;}
.epbar{position:absolute;bottom:40px;left:32px;right:32px;
  height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.epfill{height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold),var(--gl));
  border-radius:2px;transition:width 2.8s linear;box-shadow:0 0 8px var(--gg);}
.eskip{position:absolute;bottom:12px;right:20px;
  font-size:11px;font-weight:700;color:var(--muted);
  padding:10px 14px;cursor:pointer;opacity:0;
  transition:opacity .3s;touch-action:manipulation;}
.eov.show .eskip{opacity:1;}

/* ── FINAL Q ── */
.fqs{background:transparent;}
.fqb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 28px 20px;}
.fqbadge{display:inline-flex;align-items:center;padding:5px 12px;border-radius:30px;
  background:var(--gls);border:1px solid var(--bdg);
  font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold);margin-bottom:18px;align-self:center;animation:fu .4s .05s ease both;}
.fqh{font-size:clamp(18px,4.8vw,23px);font-weight:900;color:var(--txt);
  line-height:1.28;margin-bottom:18px;text-align:center;animation:fu .4s .1s ease both;}
.fqlist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;
  animation:fu .4s .15s ease both;}
.fqi{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--dim);}
.fqchk{width:20px;height:20px;border-radius:50%;background:var(--gls);
  border:1.5px solid var(--bdg);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--gold);flex-shrink:0;}
.fqend{text-align:center;font-size:15px;color:var(--dim);line-height:1.65;margin-bottom:16px;
  animation:fu .4s .2s ease both;}
.fqend strong{font-size:20px;font-weight:900;color:var(--txt);display:block;margin-top:6px;}
.fqopts{display:flex;flex-direction:column;gap:10px;animation:fu .4s .25s ease both;}
.fqbtn{width:100%;padding:17px 24px;border-radius:18px;
  border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
  cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;
  color:var(--txt);transition:all .2s;text-align:center;touch-action:manipulation;}
.fqbtn:hover{border-color:var(--bdg);background:var(--gls);}
.fqbtn:active{transform:scale(.97);}
.fqbtn.ch{background:var(--gls);border-color:var(--gold);color:var(--gl);}
.fqbtn.fd{opacity:.12;pointer-events:none;}
.fqresp{margin-top:12px;padding:14px 16px;background:var(--gls);
  border:1px solid var(--bdg);border-radius:14px;font-size:14px;
  color:var(--dim);line-height:1.65;display:none;animation:fu .3s ease both;}
.fqresp b{color:var(--gl);font-weight:800;}
.fqresp.show{display:block;}

/* ── REVEAL ── */
.ws{background:transparent;position:relative;overflow:hidden;}
.wp{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 28px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wp.in{opacity:1;pointer-events:auto;}
.wp.out{opacity:0;pointer-events:none;}

/* ph1 stat */
.sblk{text-align:center;margin-bottom:22px;}
.spre{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;}
.snum{font-size:min(19vw,96px);font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold),var(--gl),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:npop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes npop{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:scale(1);}}
.spct{font-size:30px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--gl));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ssub{font-size:15px;color:var(--dim);line-height:1.62;
  max-width:280px;margin:12px auto 0;}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  margin-top:22px;max-width:320px;}
.pill{padding:7px 13px;border-radius:30px;background:var(--sf);
  border:1px solid var(--bdr);font-size:11px;font-weight:600;color:var(--dim);
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;}
.pill.in{opacity:1;transform:translateY(0);}

/* ph2 pivot */
.pvpre{font-size:13px;color:var(--dim);text-align:center;margin-bottom:18px;letter-spacing:.3px;}
.pvbig{font-size:clamp(26px,6.5vw,36px);font-weight:900;color:var(--txt);
  text-align:center;line-height:1.22;
  opacity:0;transform:translateY(16px);transition:opacity .5s .2s,transform .5s .2s;}
.pvbig em{background:linear-gradient(135deg,var(--gold),var(--gl));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;font-style:normal;}
.wp.in .pvbig{opacity:1;transform:translateY(0);}

/* ph3 tendr */
.rlogo{width:min(155px,52vw);height:auto;margin-bottom:22px;flex-shrink:0;
  opacity:0;transform:scale(.85) translateY(10px);
  transition:opacity .55s,transform .55s;}
.wp.in .rlogo{opacity:1;transform:scale(1) translateY(0);}
.feats{display:flex;flex-direction:column;gap:9px;width:100%;margin-bottom:22px;}
.feat{display:flex;align-items:center;gap:13px;padding:13px 16px;
  background:linear-gradient(135deg,var(--gls),rgba(255,255,255,.02));
  border:1px solid var(--bdg);border-radius:14px;
  opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;}
.feat.in{opacity:1;transform:translateY(0);}
.fi{font-size:20px;flex-shrink:0;}
.ft{font-size:14px;font-weight:700;color:var(--txt);line-height:1.35;}

/* glow CTA */
.ctaw{position:relative;width:100%;}
.ctag{position:absolute;inset:-10px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 50%,var(--gg),transparent 70%);
  animation:cpulse 2.6s 1s ease-in-out infinite;}
@keyframes cpulse{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:.72;transform:scale(1.05);}}
.ctab{display:flex;align-items:center;justify-content:center;
  width:100%;padding:20px 24px;
  background:linear-gradient(135deg,var(--gold),var(--gl));
  border:none;border-radius:18px;font-size:16px;font-weight:900;color:#09081A;
  cursor:pointer;font-family:inherit;text-decoration:none;position:relative;overflow:hidden;
  box-shadow:0 4px 28px var(--gg);
  opacity:0;transition:opacity .5s,transform .15s;}
.ctab.in{opacity:1;}
.ctab:active{transform:scale(.97);}
.ctab::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%);
  animation:sh 2.8s 1.2s infinite;}
@keyframes sh{0%,44%{transform:translateX(-200%);}100%{transform:translateX(200%);}}

/* ── UTILS ── */
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="amb"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="pb"><div id="pf"></div></div>
<div id="app"></div>

// ── STATE ──
let lang='en', fqc=0, adv=null;
const app=document.getElementById('app'), pf=document.getElementById('pf');
const PROG=[0,20,40,60,80,86,100];
const STYLES=['fade','card','wipe','punch'];

const LOGO=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 172" class="rlogo">
  <path d="M55,8L125,8C133,8 135,22 129,42Q118,68 100,84L94,88L94,110Q94,116 106,116L74,116Q86,116 86,110L86,88L80,84Q62,68 51,42C45,22 47,8 55,8Z"
    fill="rgba(200,155,60,.1)" stroke="#C89B3C" stroke-width="2.5"/>
  <path d="M64,56Q90,68 116,56Q112,72 100,84L80,84Q68,72 64,56Z" fill="rgba(200,155,60,.38)"/>
  <path d="M22,26L25.5,17L29,26L38,29.5L29,33L25.5,42L22,33L13,29.5Z" fill="#EDBD5A"/>
  <path d="M14,58L16.5,51L19,58L26,60.5L19,63L16.5,70L14,63L7,60.5Z" fill="#C89B3C" opacity=".7"/>
  <path d="M148,18L150.5,12L153,18L159,20.5L153,23L150.5,29L148,23L142,20.5Z" fill="#C89B3C" opacity=".65"/>
  <circle cx="158" cy="54" r="3" fill="#C89B3C" opacity=".45"/>
  <text x="90" y="148" font-family="Georgia,serif" font-size="33" fill="#EDBD5A" text-anchor="middle" letter-spacing="3">tendr</text>
  <text x="90" y="165" font-family="-apple-system,Arial,sans-serif" font-size="7.5" fill="#C89B3C" text-anchor="middle" letter-spacing="2.5">— • WE CURATE YOU CELEBRATE • —</text>
</svg>`;

function prog(p){pf.style.width=p+'%';}

function go(html){
  const prev=app.querySelector('.screen');
  const w=document.createElement('div');w.innerHTML=html;
  const next=w.firstElementChild;
  next.style.cssText='transform:translateX(100%) scale(.95);opacity:0;';
  app.appendChild(next);
  if(prev){
    prev.style.transition='transform .38s cubic-bezier(.4,0,.8,0),opacity .32s ease';
    prev.style.transform='translateX(-26%) scale(.96)';
    prev.style.opacity='0';
    setTimeout(()=>prev.remove(),420);
  }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    next.style.transition='transform .44s cubic-bezier(.08,.9,.22,1),opacity .36s ease';
    next.style.transform='translateX(0) scale(1)';
    next.style.opacity='1';
  }));
}

function dots(a){
  return[0,1,2,3].map(i=>`<div class="dot${i===a?' on':i<a?' dn':''}"></div>`).join('');
}

// particles
(function(){
  const amb=document.getElementById('amb');
  for(let i=0;i<14;i++){
    const p=document.createElement('div');p.className='ptcl';
    const s=Math.random()*2.5+1.2;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*50}%;animation-duration:${4+Math.random()*6}s;animation-delay:${Math.random()*8}s;`;
    amb.appendChild(p);
  }
})();

// ── LANG ──
function langScreen(){
  prog(0);
  go(`<div class="screen ls">
    <div class="tm"><span class="tl">tendr</span><span class="tt">We Curate · You Celebrate</span></div>
    <div class="lh">
      <div class="lhp">Before we introduce ourselves</div>

      <div class="lhs" style="margin-top:10px">Just a quick conversation — and something worth seeing at the end.</div>
    </div>
    <div class="ll">Pick your language</div>
    <div class="llist">
      <button class="lb" onclick="setLang('en')"><div class="lf">🇬🇧</div><div><span class="ln">English</span><span class="lsub">Continue in English</span></div></button>
      <button class="lb" onclick="setLang('hi')"><div class="lf">🇮🇳</div><div><span class="ln">हिन्दी</span><span class="lsub">हिंदी में चलते हैं</span></div></button>
      <button class="lb" onclick="setLang('hl')"><div class="lf">✌️</div><div><span class="ln">Hinglish</span><span class="lsub">Mix karke chalte hain bhai</span></div></button>
    </div>
  </div>`);
}
function setLang(l){lang=l;renderQ(0);}

// ── QUESTION ──
function renderQ(idx){
  const q=L[lang].qs[idx];
  prog(PROG[idx+1]);
  go(`<div class="screen qs">
    <div class="qh">
      <div class="qdots">${dots(idx)}</div>
      <div class="qnum">${idx+1} of 4</div>
    </div>
    <div class="qb">
      <div class="qbadge">${q.badge}</div>
      <div class="qhead">${q.head}</div>
      <div class="qsub">${q.sub}</div>
    </div>
    <div class="qc">
      <button class="ch yo" id="by" onclick="ans('y',${idx})">
        <span class="ce">${q.y.em}</span>
        <div><div class="ct">${q.y.t}</div><span class="cs">${q.y.s}</span></div>
      </button>
      <button class="ch no" id="bn" onclick="ans('n',${idx})">
        <span class="ce">${q.n.em}</span>
        <div><div class="ct">${q.n.t}</div><span class="cs">${q.n.s}</span></div>
      </button>
    </div>
    <div class="eov" id="eov" data-s="${STYLES[idx]}" onclick="advance(${idx})">
      <div class="ei" id="ei"></div>
      <div class="et" id="et"></div>
      <div class="eb" id="eb"></div>
      <div class="epbar"><div class="epfill" id="epf"></div></div>
      <div class="eskip">${L[lang].skip[idx]}</div>
    </div>
  </div>`);
}

function advance(idx){
  clearTimeout(adv);
  idx<3?renderQ(idx+1):showFQ();
}

function ans(w,idx){
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by.disabled)return;
  by.disabled=true;bn.disabled=true;
  const btn=w==='y'?by:bn;
  btn.classList.add('rp');setTimeout(()=>btn.classList.remove('rp'),600);
  const q=L[lang].qs[idx];
  const ov=w==='y'?q.oy:q.on;
  if(w==='y'){by.classList.add('cy');bn.classList.add('fd');}
  else{bn.classList.add('cn');by.classList.add('fd');}
  const el=document.getElementById('eov');
  document.getElementById('ei').textContent=ov.icon;
  document.getElementById('et').innerHTML=ov.t;
  document.getElementById('eb').innerHTML=ov.b;
  const st=el.dataset.s;
  setTimeout(()=>el.classList.add('show'),st==='card'||st==='wipe'?55:120);
  setTimeout(()=>{const f=document.getElementById('epf');if(f)requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width='100%'));},360);
  adv=setTimeout(()=>advance(idx),3300);
}

// ── FINAL Q ──
function showFQ(){
  const fq=L[lang].fq;
  prog(PROG[5]);
  go(`<div class="screen fqs">
    <div class="qh">
      <div class="qdots">${[0,1,2,3].map(()=>'<div class="dot dn"></div>').join('')}</div>
      <div class="qnum">Final</div>
    </div>
    <div class="fqb">
      <div class="fqbadge">✦ ${fq.badge}</div>
      <div class="fqh">${fq.head}</div>
      <div class="fqlist">${fq.items.map(it=>`<div class="fqi"><div class="fqchk">✓</div>${it}</div>`).join('')}</div>
      <div class="fqend">${fq.end}<strong></strong></div>
      <div class="fqopts">${fq.opts.map((o,i)=>`<button class="fqbtn" id="fo${i}" onclick="ansFQ(${i})">${o.l}</button>`).join('')}</div>
      <div class="fqresp" id="fqr"></div>
    </div>
  </div>`);
}

function ansFQ(c){
  [0,1,2].forEach(i=>{const b=document.getElementById('fo'+i);if(b)b.disabled=true;});
  document.getElementById('fo'+c)?.classList.add('ch');
  [0,1,2].filter(i=>i!==c).forEach(i=>document.getElementById('fo'+i)?.classList.add('fd'));
  fqc=c;
  const r=document.getElementById('fqr');
  r.innerHTML=L[lang].fq.resp[c];r.style.display='block';
  setTimeout(()=>r.classList.add('show'),30);
  setTimeout(showReveal,3000);
}

// ── REVEAL ──
function showReveal(){
  const r=L[lang].rev;
  const opener=L[lang].fq.opts[fqc]?.o||L[lang].fq.opts[0].o;
  prog(100);
  go(`<div class="screen ws">
    <div class="wp" id="ph1">
      <div class="sblk">
        <div class="spre">${r.spre}</div>
        <div class="snum">89</div>
        <div class="spct">%</div>
        <div class="ssub">${r.ssub}</div>
      </div>
      <div class="pills">${r.pills.map((p,i)=>`<div class="pill" id="pl${i}">${p}</div>`).join('')}</div>
    </div>
    <div class="wp" id="ph2">
      <div class="pvpre">${opener}</div>
      <div class="pvbig">${r.pvbig}</div>
    </div>
    <div class="wp" id="ph3">
      ${LOGO}
      <div class="feats">${r.feats.map((f,i)=>`<div class="feat" id="wf${i}"><span class="fi">${f.i}</span><span class="ft">${f.t}</span></div>`).join('')}</div>
      <div class="ctaw">
        <div class="ctag"></div>
        <a class="ctab" id="wcta" href="https://tendr.co.in" target="_blank">${r.cta}</a>
      </div>
    </div>
  </div>`);

  setTimeout(()=>document.getElementById('ph1')?.classList.add('in'),100);
  r.pills.forEach((_,i)=>setTimeout(()=>document.getElementById('pl'+i)?.classList.add('in'),800+i*100));

  setTimeout(()=>{
    const p=document.getElementById('ph1');
    if(p){p.classList.remove('in');p.classList.add('out');}
    setTimeout(()=>document.getElementById('ph2')?.classList.add('in'),480);
  },3800);

  setTimeout(()=>{
    const p=document.getElementById('ph2');
    if(p){p.classList.remove('in');p.classList.add('out');}
    setTimeout(()=>{
      document.getElementById('ph3')?.classList.add('in');
      r.feats.forEach((_,i)=>setTimeout(()=>document.getElementById('wf'+i)?.classList.add('in'),300+i*140));
      setTimeout(()=>document.getElementById('wcta')?.classList.add('in'),1000);
    },480);
  },7000);
}
