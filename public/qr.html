<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09081A">
<title>Tendr — We Curate, You Celebrate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#09081A;--sf:#0D0C22;--sf2:#14132E;
  --gold:#C89B3C;--gl:#EDBD5A;--gg:rgba(200,155,60,.3);--gls:rgba(200,155,60,.08);
  --txt:#EAE5DB;--dim:#6A6488;--muted:#383658;
  --bdr:rgba(255,255,255,.07);--bdg:rgba(200,155,60,.22);
  --grn:#3ECF8E;--grng:rgba(62,207,142,.11);--grnb:rgba(62,207,142,.28);
  --font:'Plus Jakarta Sans',-apple-system,'SF Pro Display',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;}

/* ── AMBIENT ── */
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(100px);animation:orbf 18s ease-in-out infinite;}
.o1{width:460px;height:460px;background:radial-gradient(#C89B3C,transparent);top:-120px;left:-120px;opacity:.13;animation-delay:0s;}
.o2{width:340px;height:340px;background:radial-gradient(#5E35B1,transparent);bottom:0;right:-90px;opacity:.11;animation-delay:-8s;}
.o3{width:260px;height:260px;background:radial-gradient(#C89B3C,transparent);bottom:42%;left:8%;opacity:.07;animation-delay:-14s;}
@keyframes orbf{0%,100%{transform:translate(0,0) scale(1);}40%{transform:translate(16px,-24px) scale(1.07);}70%{transform:translate(-9px,14px) scale(.93);}}
.ptcl{position:absolute;border-radius:50%;background:var(--gold);opacity:0;animation:ptf linear infinite;}
@keyframes ptf{0%{opacity:0;transform:translateY(0);}10%{opacity:.55;}88%{opacity:.08;}100%{opacity:0;transform:translateY(-140px);}}

/* ── SHELL ── */
#app{position:relative;z-index:1;height:100vh;height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#pb{position:fixed;top:0;left:0;right:0;height:2px;z-index:100;background:rgba(255,255,255,.04);}
#pf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gl));width:0%;transition:width .65s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px var(--gg);}

.screen{position:absolute;width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;}

/* ── LANG SCREEN ── */
.ls{align-items:center;justify-content:center;padding:52px 28px;}
.tm{text-align:center;margin-bottom:48px;}
.tl{font-size:11px;font-weight:800;letter-spacing:6px;text-transform:uppercase;color:var(--txt);opacity:.3;display:block;margin-bottom:8px;}
.tt{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.55;}
.lhd{text-align:center;margin-bottom:36px;}
.lhp{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.65;margin-bottom:14px;}
.lhh{font-size:34px;font-weight:900;color:var(--txt);line-height:1.16;margin-bottom:12px;}
.lhs{font-size:15px;color:var(--dim);line-height:1.75;}
.ll{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;text-align:center;}
.llist{display:flex;flex-direction:column;gap:10px;width:100%;}
.lb{display:flex;align-items:center;gap:18px;padding:20px 22px;background:var(--sf);border:1.5px solid var(--bdr);border-radius:18px;cursor:pointer;color:var(--txt);font-family:var(--font);transition:border-color .2s,background .2s,transform .15s;text-align:left;touch-action:manipulation;position:relative;overflow:hidden;}
.lb::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(200,155,60,.07) 60%,transparent 80%);transform:translateX(-100%);transition:transform .4s ease;}
.lb:hover::after,.lb:focus::after{transform:translateX(100%);}
.lb:hover{border-color:var(--bdg);}
.lb:active{transform:scale(.97);}
.lf{font-size:26px;flex-shrink:0;}
.ln{font-size:17px;font-weight:800;display:block;}
.lsub{font-size:12px;color:var(--dim);margin-top:3px;display:block;}

/* ── QUESTION SCREEN ── */
.qs{background:transparent;position:relative;overflow:hidden;}

/* Huge faint background number — typographic texture, not AI-template */
.qbg{position:absolute;right:-12px;top:50%;transform:translateY(-52%);
  font-size:clamp(160px,42vw,200px);font-weight:900;line-height:1;
  color:rgba(200,155,60,.04);letter-spacing:-6px;pointer-events:none;
  -webkit-user-select:none;user-select:none;}

/* Thin gold vertical accent — left edge, breaks the rectangle */
.qs::before{content:'';position:absolute;left:0;top:18%;bottom:18%;
  width:2px;background:linear-gradient(180deg,transparent,rgba(200,155,60,.4) 35%,rgba(200,155,60,.4) 65%,transparent);
  border-radius:0 2px 2px 0;}

.qtop{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px)+18px) 28px 0;flex-shrink:0;}
.qdots{display:flex;gap:7px;align-items:center;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:all .45s cubic-bezier(.08,.9,.22,1);}
.dot.on{background:var(--gold);width:22px;border-radius:4px;box-shadow:0 0 8px var(--gg);}
.dot.dn{background:var(--gold);opacity:.28;}
.qstep{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);}

/* Question body — CENTERED, not flex-end */
.qbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 28px 12px;}
.qcat{font-size:10px;font-weight:800;letter-spacing:3.5px;text-transform:uppercase;
  color:var(--gold);opacity:.65;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.qcat::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(200,155,60,.25),transparent);}

/* Question text — large, blur-in, left aligned */
.qtxt{font-size:clamp(26px,7vw,32px);font-weight:900;color:var(--txt);line-height:1.24;
  opacity:0;filter:blur(8px);transform:translateY(14px);
  transition:opacity .65s .08s ease,filter .65s .08s ease,transform .65s .08s cubic-bezier(.08,.9,.22,1);}
.qtxt.reveal{opacity:1;filter:blur(0);transform:translateY(0);}

/* Separator between question and answers */
.qdiv{height:1px;margin:20px 20px 0;flex-shrink:0;
  background:linear-gradient(90deg,transparent,rgba(200,155,60,.18) 25%,rgba(200,155,60,.18) 75%,transparent);}

/* ── ANSWER CARDS — visually distinct YES vs NO ── */
.qans{padding:16px 20px calc(env(safe-area-inset-bottom,0px)+24px);display:flex;flex-direction:column;gap:11px;flex-shrink:0;}

.ans{display:flex;align-items:center;gap:15px;padding:0 20px;
  border-radius:18px;border:1.5px solid;cursor:pointer;font-family:var(--font);text-align:left;
  transition:transform .32s cubic-bezier(.15,1.5,.35,1),opacity .25s ease,
             border-color .22s,background .22s,box-shadow .28s,min-height .0s;
  position:relative;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  min-height:72px;}
.ans:active{transform:scale(.97);}

.aem{font-size:28px;flex-shrink:0;transition:transform .35s cubic-bezier(.15,1.5,.35,1);}
.atxt{flex:1;}
.am{font-size:16px;font-weight:800;color:var(--txt);line-height:1.3;display:block;}
.as{font-size:12px;color:var(--dim);margin-top:2px;display:block;line-height:1.5;}
.abadge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:900;opacity:0;transform:scale(0);flex-shrink:0;
  transition:opacity .22s,transform .3s cubic-bezier(.15,1.5,.35,1);}

/* YES default: green-tinted, feels warmer (the common pain-point answer) */
.ans-y{background:var(--grng);border-color:var(--grnb);}
/* NO default: very subtle, clearly secondary */
.ans-n{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.08);}

/* Selected YES */
.ans.cy{background:rgba(62,207,142,.18);border-color:var(--grn);border-width:2px;
  transform:scale(1.025) translateY(-3px);
  box-shadow:0 0 0 1px rgba(62,207,142,.22),0 14px 42px rgba(62,207,142,.16);}
.ans.cy .am{color:var(--grn);}
.ans.cy .aem{transform:scale(1.25);}
.ans.cy .abadge{background:var(--grn);color:#09081A;opacity:1;transform:scale(1);}

/* Selected NO */
.ans.cn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);border-width:2px;
  transform:scale(1.02) translateY(-3px);
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 14px 36px rgba(255,255,255,.04);}
.ans.cn .aem{transform:scale(1.18);}
.ans.cn .abadge{background:rgba(255,255,255,.82);color:#09081A;opacity:1;transform:scale(1);}

/* Faded — aggressive fade, clearly unchosen */
.ans.fd{opacity:.06;transform:scale(0.95);pointer-events:none;}

/* ripple */
.ans::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;
  background:rgba(255,255,255,.07);transform:scale(0);opacity:1;pointer-events:none;
  transition:transform .6s ease,opacity .6s ease;left:50%;top:50%;translate:-50% -50%;}
.ans.rp::after{transform:scale(2.6);opacity:0;}

/* ── EMPATHY SCREEN — clean, full, readable ── */
.emph{position:relative;align-items:center;justify-content:center;
  padding:52px 36px calc(env(safe-area-inset-bottom,0px)+90px);}
/* Radial gold glow around icon */
.emph::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(200,155,60,.1),transparent 70%);
  pointer-events:none;}
.emph-wrap{text-align:center;max-width:300px;position:relative;}
.emph-icon{font-size:56px;margin-bottom:24px;display:block;
  animation:epop .45s .05s cubic-bezier(.15,1.6,.35,1) both;}
@keyframes epop{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0deg);}}
.emph-head{font-size:clamp(22px,5.5vw,26px);font-weight:900;color:var(--txt);line-height:1.24;
  margin-bottom:14px;animation:fu .5s .18s ease both;}
.emph-head b{color:var(--gl);}
.emph-body{font-size:16px;color:var(--dim);line-height:1.78;animation:fu .5s .28s ease both;}
.emph-foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px)+18px);
  left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;}
.emph-bar{width:160px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.emph-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gl));
  border-radius:2px;transition:width 3.2s linear;}
.emph-skip{font-size:12px;font-weight:700;color:var(--muted);padding:10px 18px;
  cursor:pointer;touch-action:manipulation;}

/* ── FINAL Q — mysterious cycling questions ── */
.fqs{align-items:center;justify-content:center;padding:0 32px;}
.fq-inner{width:100%;text-align:center;}
.fq-pre{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);opacity:.6;margin-bottom:28px;animation:fu .5s ease both;}
.fq-big{font-size:clamp(24px,6.5vw,30px);font-weight:900;color:var(--txt);line-height:1.22;
  min-height:100px;display:flex;align-items:center;justify-content:center;
  margin-bottom:52px;animation:fu .5s .12s ease both;}
.fq-cycle{display:block;transition:opacity .3s ease,transform .3s cubic-bezier(.08,.9,.22,1);}
.fq-opts{display:flex;flex-direction:column;gap:12px;animation:fu .5s .24s ease both;}
.fqbtn{width:100%;padding:20px 24px;border-radius:20px;cursor:pointer;font-family:var(--font);
  font-size:16px;font-weight:700;color:var(--txt);transition:all .2s;text-align:center;touch-action:manipulation;}
.fqbtn-p{background:var(--gls);border:1.5px solid var(--bdg);}
.fqbtn-p:hover{border-color:var(--gold);background:rgba(200,155,60,.12);}
.fqbtn-s{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);}
.fqbtn-s:hover{border-color:rgba(255,255,255,.18);}
.fqbtn:active{transform:scale(.97);}
.fqbtn.sel{border-width:2px;}
.fqbtn-p.sel{background:rgba(200,155,60,.14);border-color:var(--gold);color:var(--gl);}
.fqbtn-s.sel{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.35);}
.fqbtn.fd{opacity:.1;pointer-events:none;}
.fqresp{margin-top:18px;padding:18px 20px;
  background:linear-gradient(135deg,rgba(200,155,60,.1),rgba(200,155,60,.04));
  border:1.5px solid var(--bdg);border-radius:16px;font-size:15px;font-weight:600;
  color:var(--txt);line-height:1.65;display:none;text-align:center;}
.fqresp b{color:var(--gl);}
.fqresp.show{display:block;animation:fu .3s ease both;}

/* ── REVEAL ── */
.ws{position:relative;overflow:hidden;}
.wp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 32px;opacity:0;pointer-events:none;
  transition:opacity .5s ease;overflow-y:auto;}
.wp.in{opacity:1;pointer-events:auto;}
.wp.out{opacity:0;pointer-events:none;}

/* ph1 stat */
.sblk{text-align:center;position:relative;}
.spre{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}
/* Big "8" + "in 10" split — more visual interest than a percentage */
.srow{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-bottom:4px;}
.sbig{font-size:min(30vw,130px);font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold),var(--gl));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:npop .55s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes npop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
.sin{font-size:clamp(18px,4.5vw,26px);font-weight:900;color:rgba(234,229,219,.35);letter-spacing:-.5px;}
.ssub{font-size:16px;color:var(--dim);line-height:1.72;max-width:270px;margin:20px auto 0;}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px;max-width:300px;}
.pill{padding:7px 13px;border-radius:30px;background:var(--sf);border:1px solid var(--bdr);
  font-size:11px;font-weight:600;color:var(--dim);opacity:0;transform:translateY(10px);
  transition:opacity .3s,transform .3s;}
.pill.in{opacity:1;transform:translateY(0);}

/* ph2 feature flash — blur-slide, large, cinematic */
.ffw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 36px;text-align:center;pointer-events:none;}
.ffnum{font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);opacity:.4;margin-bottom:22px;}
.ffem{font-size:56px;margin-bottom:22px;opacity:0;filter:blur(10px);transform:scale(.82);
  transition:opacity .5s ease,filter .5s ease,transform .5s cubic-bezier(.08,.9,.22,1);}
.fftxt{font-size:clamp(28px,7.5vw,38px);font-weight:900;color:var(--txt);line-height:1.2;
  opacity:0;filter:blur(8px);transform:translateY(22px);
  transition:opacity .48s .07s ease,filter .48s .07s ease,transform .48s .07s cubic-bezier(.08,.9,.22,1);}
.ffw.on .ffem{opacity:1;filter:blur(0);transform:scale(1);}
.ffw.on .fftxt{opacity:1;filter:blur(0);transform:translateY(0);}
.ffw.off .ffem{opacity:0;filter:blur(8px);transform:scale(1.12);}
.ffw.off .fftxt{opacity:0;filter:blur(5px);transform:translateY(-16px);}

/* ph3 converge → logo → CTA */
.conv{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(270px,72vw);margin-bottom:32px;
  transition:transform .62s cubic-bezier(.4,0,.8,0),opacity .45s ease;}
.conv.collapse{transform:scale(0);opacity:0;}
.cpill{padding:15px 14px;border-radius:14px;background:var(--sf);border:1px solid var(--bdg);
  font-size:13px;font-weight:700;color:var(--txt);text-align:center;line-height:1.35;
  opacity:0;transform:scale(.78);transition:opacity .4s,transform .42s cubic-bezier(.15,1.5,.35,1);}
.cpill.in{opacity:1;transform:scale(1);}
.ci{font-size:22px;display:block;margin-bottom:6px;}
.rlogo{width:min(148px,48vw);height:auto;opacity:0;transform:scale(.65) translateY(8px);
  transition:opacity .58s,transform .58s cubic-bezier(.15,1.5,.35,1);}
.rlogo.in{opacity:1;transform:scale(1) translateY(0);}
.ctaw{position:relative;width:100%;margin-top:26px;}
.ctag{position:absolute;inset:-12px;border-radius:28px;
  background:radial-gradient(ellipse at 50% 50%,var(--gg),transparent 70%);
  animation:cpulse 2.8s 1s ease-in-out infinite;}
@keyframes cpulse{0%,100%{opacity:.32;transform:scale(1);}50%{opacity:.62;transform:scale(1.06);}}
.ctab{display:flex;align-items:center;justify-content:center;width:100%;padding:22px 24px;
  background:linear-gradient(135deg,var(--gold),var(--gl));border:none;border-radius:20px;
  font-size:17px;font-weight:900;color:#09081A;cursor:pointer;font-family:var(--font);
  text-decoration:none;position:relative;overflow:hidden;
  box-shadow:0 4px 32px var(--gg);opacity:0;transition:opacity .5s,transform .15s;}
.ctab.in{opacity:1;}
.ctab:active{transform:scale(.97);}
.ctab::after{content:'';position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  animation:sh 3s 1.5s infinite;}
@keyframes sh{0%,40%{transform:translateX(-200%);}100%{transform:translateX(200%);}}

/* ── UTILS ── */
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="amb"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div id="pb"><div id="pf"></div></div>
<div id="app"></div>

<script>

/* ── STATE ── */
let lang='en',yCount=0,fqTimer=null,advTimer=null;
const app=document.getElementById('app'),pf=document.getElementById('pf');
const PROG=[0,20,40,58,76,88,100];

  <path d="M55,8L125,8C133,8 135,22 129,42Q118,68 100,84L94,88L94,110Q94,116 106,116L74,116Q86,116 86,110L86,88L80,84Q62,68 51,42C45,22 47,8 55,8Z" fill="rgba(200,155,60,.1)" stroke="#C89B3C" stroke-width="2.5"/>

</svg>`;

function prog(p){pf.style.width=p+'%';}

function go(html,dir='right'){
  const prev=app.querySelector('.screen');
  const w=document.createElement('div');w.innerHTML=html;
  const next=w.firstElementChild;
  const tx=dir==='right'?'100%':'-100%';
  next.style.cssText=`transform:translateX(${tx}) scale(.96);opacity:0;`;
  app.appendChild(next);
  if(prev){
    prev.style.transition='transform .38s cubic-bezier(.4,0,.8,0),opacity .3s ease';
    prev.style.transform=dir==='right'?'translateX(-18%) scale(.96)':'translateX(18%) scale(.96)';
    prev.style.opacity='0';
    setTimeout(()=>prev.remove(),400);
  }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    next.style.transition='transform .44s cubic-bezier(.08,.9,.22,1),opacity .36s ease';
    next.style.transform='translateX(0) scale(1)';
    next.style.opacity='1';
  }));
}

function dots(a){
  return[0,1,2,3].map(i=>`<div class="dot${i===a?' on':i<a?' dn':''}"></div>`).join('');
}

/* Particles */
(function(){
  const amb=document.getElementById('amb');
  for(let i=0;i<14;i++){
    const p=document.createElement('div');p.className='ptcl';
    const s=Math.random()*2.5+1;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${Math.random()*55}%;animation-duration:${4+Math.random()*7}s;animation-delay:${Math.random()*9}s;`;
    amb.appendChild(p);
  }
})();

function langScreen(){
  prog(0);
  go(`<div class="screen ls">
    <div class="tm"><span class="tl">tendr</span><span class="tt">We Curate · You Celebrate</span></div>
    <div class="lhd">
      <div class="lhp">Before we introduce ourselves</div>

    <div class="ll">Pick your language</div>
    <div class="llist">
      <button class="lb" onclick="setLang('en')"><div class="lf">🇬🇧</div><div><span class="ln">English</span><span class="lsub">Continue in English</span></div></button>
      <button class="lb" onclick="setLang('hi')"><div class="lf">🇮🇳</div><div><span class="ln">हिन्दी</span><span class="lsub">हिंदी में चलते हैं</span></div></button>
      <button class="lb" onclick="setLang('hl')"><div class="lf">✌️</div><div><span class="ln">Hinglish</span><span class="lsub">Mix karke chalte hain bhai</span></div></button>
    </div>
  </div>`);
}
function setLang(l){lang=l;yCount=0;renderQ(0);}

/* ── QUESTION SCREEN ── */
function renderQ(idx){
  const q=L[lang].qs[idx];
  prog(PROG[idx+1]);
  go(`<div class="screen qs">
    <div class="qbg">${String(idx+1).padStart(2,'0')}</div>
    <div class="qtop">
      <div class="qdots">${dots(idx)}</div>
      <div class="qstep">${idx+1} of 4</div>
    </div>
    <div class="qbody">
      <div class="qcat">${q.cat}</div>
      <div class="qtxt" id="qtxt">${q.q}</div>
    </div>
    <div class="qdiv"></div>
    <div class="qans">
      <button class="ans ans-y" id="by" onclick="ans('y',${idx})">
        <span class="aem">${q.y.em}</span>
        <span class="atxt"><span class="am">${q.y.m}</span><span class="as">${q.y.s}</span></span>
        <span class="abadge">✓</span>
      </button>
      <button class="ans ans-n" id="bn" onclick="ans('n',${idx})">
        <span class="aem">${q.n.em}</span>
        <span class="atxt"><span class="am">${q.n.m}</span><span class="as">${q.n.s}</span></span>
        <span class="abadge">✓</span>
      </button>
    </div>
  </div>`);

  /* Blur-in reveal on the full question (no word-split bug) */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.getElementById('qtxt')?.classList.add('reveal');
  }));
}

function ans(w,idx){
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(!by||by.disabled)return;
  by.disabled=true;bn.disabled=true;
  const btn=w==='y'?by:bn;
  btn.classList.add('rp');
  if(w==='y'){by.classList.add('cy');bn.classList.add('fd');yCount++;}
  else{bn.classList.add('cn');by.classList.add('fd');}
  setTimeout(()=>showEmpathy(idx,w),620);
}

/* ── EMPATHY SCREEN — separate, fully readable ── */
function showEmpathy(idx,w){
  const ov=(w==='y'?L[lang].qs[idx].oy:L[lang].qs[idx].on);
  prog(PROG[idx+1]+4);
  go(`<div class="screen emph">
    <div class="emph-wrap">
      <span class="emph-icon">${ov.icon}</span>
      <div class="emph-head">${ov.h}</div>
      <div class="emph-body">${ov.b}</div>
    </div>
    <div class="emph-foot">
      <div class="emph-bar"><div class="emph-fill" id="ef"></div></div>
      <div class="emph-skip" onclick="doAdv(${idx})">${L[lang].skip[idx]}</div>
    </div>
  </div>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const f=document.getElementById('ef');if(f)f.style.width='100%';
  }));
  advTimer=setTimeout(()=>doAdv(idx),3400);
}

function doAdv(idx){clearTimeout(advTimer);idx<3?renderQ(idx+1):showFQ();}

/* ── FINAL Q — mystery cycling ── */
function showFQ(){
  const fq=L[lang].fq;
  prog(PROG[5]);
  go(`<div class="screen fqs">
    <div class="fq-inner">
      <div class="fq-pre">${fq.pre}</div>
      <div class="fq-big"><span class="fq-cycle" id="fqc">${L[lang].fqcycle[0]}</span></div>
      <div class="fq-opts">
        ${fq.opts.map((o,i)=>`<button class="fqbtn ${o.cls}" id="fo${i}" onclick="ansFQ(${i})">${o.l}</button>`).join('')}
      </div>
      <div class="fqresp" id="fqr"></div>
    </div>
  </div>`);

  let ci=0;
  fqTimer=setInterval(()=>{
    const el=document.getElementById('fqc');
    if(!el){clearInterval(fqTimer);return;}
    el.style.opacity='0';el.style.transform='translateY(-12px)';
    setTimeout(()=>{
      if(!el.isConnected){clearInterval(fqTimer);return;}
      ci=(ci+1)%L[lang].fqcycle.length;
      el.textContent=L[lang].fqcycle[ci];
      el.style.opacity='1';el.style.transform='translateY(0)';
    },320);
  },2600);
}

function ansFQ(c){
  clearInterval(fqTimer);
  [0,1].forEach(i=>{const b=document.getElementById('fo'+i);if(b)b.disabled=true;});
  document.getElementById('fo'+c)?.classList.add('sel');
  [0,1].filter(i=>i!==c).forEach(i=>document.getElementById('fo'+i)?.classList.add('fd'));
  const r=document.getElementById('fqr');
  r.innerHTML=L[lang].fq.resp[c];r.style.display='block';
  setTimeout(()=>r.classList.add('show'),20);
  setTimeout(showReveal,2600);
}

/* ── REVEAL ── */
function showReveal(){
  const rv=L[lang].rev;
  prog(100);
  go(`<div class="screen ws">
    <div class="wp" id="ph1">
      <div class="sblk">
        <div class="spre">${rv.spre}</div>
        <div class="srow"><div class="sbig">8</div><div class="sin">in 10</div></div>
        <div class="ssub">${rv.ssub}</div>
      </div>
      <div class="pills">${rv.pills.map((p,i)=>`<div class="pill" id="pl${i}">${p}</div>`).join('')}</div>
    </div>
    <div class="wp" id="ph2">
      <div class="ffw" id="ffw">
        <div class="ffnum" id="ffnum"></div>
        <div class="ffem" id="ffem"></div>
        <div class="fftxt" id="fftxt"></div>
      </div>
    </div>
    <div class="wp" id="ph3">
      <div class="conv" id="conv">
        ${rv.feats.map((f,i)=>`<div class="cpill" id="cp${i}"><span class="ci">${f.i}</span>${f.t}</div>`).join('')}
      </div>
      ${LOGO}
      <div class="ctaw"><div class="ctag"></div><a class="ctab" id="wcta" href="https://tendr.co.in" target="_blank">${rv.cta}</a></div>
    </div>
  </div>`);

  /* ph1 — stat */
  setTimeout(()=>document.getElementById('ph1')?.classList.add('in'),100);
  rv.pills.forEach((_,i)=>setTimeout(()=>document.getElementById('pl'+i)?.classList.add('in'),900+i*110));

  /* ph1 → ph2 */
  setTimeout(()=>{
    const p=document.getElementById('ph1');
    if(p){p.classList.remove('in');p.classList.add('out');}
    setTimeout(()=>startFlash(rv.feats),520);
  },4000);
}

function startFlash(feats){
  const ph2=document.getElementById('ph2');
  if(!ph2)return;
  ph2.classList.add('in');
  let fi=0;

  const next=()=>{
    const fw=document.getElementById('ffw');
    const em=document.getElementById('ffem');
    const tx=document.getElementById('fftxt');
    const nm=document.getElementById('ffnum');
    if(!fw||!em||!tx)return;
    em.textContent=feats[fi].i;
    tx.textContent=feats[fi].t.replace('.','');
    nm.textContent=`${fi+1} of ${feats.length}`;
    fw.classList.remove('off');
    requestAnimationFrame(()=>requestAnimationFrame(()=>fw.classList.add('on')));
    setTimeout(()=>{
      fw.classList.remove('on');fw.classList.add('off');
      setTimeout(()=>{fi++;fi<feats.length?next():endFlash();},400);
    },1500);
  };
  next();
}

function endFlash(){
  const ph2=document.getElementById('ph2');
  if(ph2){ph2.classList.remove('in');ph2.classList.add('out');}
  setTimeout(startConverge,520);
}

function startConverge(){
  const ph3=document.getElementById('ph3');
  if(!ph3)return;
  ph3.classList.add('in');
  [0,1,2,3].forEach(i=>setTimeout(()=>document.getElementById('cp'+i)?.classList.add('in'),i*130));
  setTimeout(()=>{
    const conv=document.getElementById('conv');
    if(conv)conv.classList.add('collapse');
    setTimeout(()=>{
      document.querySelector('.rlogo')?.classList.add('in');
      setTimeout(()=>document.getElementById('wcta')?.classList.add('in'),900);
    },520);
  },2300);
}
