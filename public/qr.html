<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09081A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;600;700&family=Dancing+Script:wght@600&display=swap">
<title>Tendr — We Curate, You Celebrate</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#09081A;--sf:#0F0E24;--sf2:#141330;
  --gold:#C89B3C;--gl:#EDBD5A;--gg:rgba(200,155,60,.32);--gls:rgba(200,155,60,.08);
  --txt:#EAE5DB;--dim:#7A7590;--muted:#4A4660;
  --bdr:rgba(255,255,255,.07);--bdg:rgba(200,155,60,.2);
  --grn:#3ECF8E;--grng:rgba(62,207,142,.1);--grnb:rgba(62,207,142,.32);
}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  overflow:hidden;}

/* ── AMBIENT ── */
#amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(80px);
  animation:orbf 14s ease-in-out infinite;}
.o1{width:380px;height:380px;background:radial-gradient(#C89B3C,transparent);
  top:-80px;left:-90px;opacity:.18;animation-delay:0s;}
.o2{width:300px;height:300px;background:radial-gradient(#6C3FC7,transparent);
  bottom:40px;right:-70px;opacity:.14;animation-delay:-6s;}
.o3{width:220px;height:220px;background:radial-gradient(#C89B3C,transparent);
  bottom:35%;left:15%;opacity:.1;animation-delay:-10s;}
@keyframes orbf{0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(16px,-20px) scale(1.07);}
  66%{transform:translate(-10px,13px) scale(.95);}}
.ptcl{position:absolute;border-radius:50%;background:var(--gold);
  opacity:0;animation:ptf linear infinite;}
@keyframes ptf{0%{opacity:0;transform:translateY(0);}
  12%{opacity:.55;}90%{opacity:.15;}100%{opacity:0;transform:translateY(-120px);}}

/* ── SHELL ── */
#app{position:relative;z-index:1;height:100vh;height:100dvh;
  width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}

/* ── PROGRESS ── */
#pb{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;background:rgba(255,255,255,.05);}
#pf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gl));width:0%;
  transition:width .7s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px var(--gg);}

/* ── SCREEN ── */
.screen{position:absolute;width:100%;max-width:440px;
  height:100vh;height:100dvh;display:flex;flex-direction:column;}

/* ── LANG SCREEN (light cream editorial) ── */
.ls{background:#FAF7F2;overflow-y:auto;overflow-x:hidden;
  align-items:stretch;justify-content:flex-start;position:relative;}

.ls-cph{position:absolute;border-radius:50%;z-index:1;pointer-events:none;}
.ls-cph-tr{width:120px;height:120px;top:10px;right:-24px;
  background:
    radial-gradient(circle at 25% 28%,rgba(255,248,200,.95) 0%,transparent 38%),
    radial-gradient(circle at 68% 55%,rgba(255,205,80,.7) 0%,transparent 32%),
    radial-gradient(circle at 42% 75%,rgba(220,130,40,.55) 0%,transparent 35%),
    radial-gradient(ellipse at 52% 42%,#F0C060 0%,#C47A2E 70%,#7A3A10 100%);
  box-shadow:0 6px 28px rgba(196,122,46,.28);}
.ls-cph-bl{width:96px;height:96px;bottom:88px;left:-20px;
  background:
    radial-gradient(circle at 50% 38%,rgba(255,242,228,.9) 0%,transparent 38%),
    radial-gradient(circle at 72% 65%,rgba(240,170,130,.6) 0%,transparent 30%),
    radial-gradient(ellipse at 48% 52%,#F5C0A0 0%,#D06840 65%,#8B3A18 100%);
  box-shadow:0 6px 24px rgba(196,122,46,.18);}

.ls-inner{position:relative;z-index:2;display:flex;flex-direction:column;
  padding:24px 28px 28px;min-height:100%;}

.ls-hw-top{font-family:'Dancing Script',cursive;font-size:18px;color:#C47A2E;
  opacity:.85;line-height:1.4;padding-right:86px;margin-bottom:10px;}

.ls-brand{text-align:center;margin-bottom:4px;}
.ls-wm{font-family:'Cormorant Garamond',Georgia,serif;font-size:36px;font-weight:600;
  letter-spacing:.42em;color:#1C0A04;display:block;text-transform:uppercase;
  padding-left:.42em;}
.ls-btag{font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;
  letter-spacing:.18em;color:#9B7450;text-transform:uppercase;display:block;
  margin-top:4px;}

.ls-rule{width:44px;height:1px;
  background:linear-gradient(90deg,transparent,#C47A2E,transparent);
  margin:14px auto;}

.ls-hero{text-align:center;margin-bottom:16px;}
.ls-h1{font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(26px,7.5vw,34px);font-weight:600;line-height:1.22;
  color:#1C0A04;margin-bottom:10px;text-wrap:balance;}
.ls-h1 em{font-style:italic;color:#C47A2E;}
.ls-desc{font-family:'Outfit',sans-serif;font-size:13.5px;color:#9B7450;
  line-height:1.7;max-width:300px;margin:0 auto;}

.ls-stats{display:flex;gap:8px;margin:14px 0;}
.ls-stt{display:flex;flex-direction:column;align-items:center;gap:5px;
  flex:1;text-align:center;padding:11px 4px;
  background:rgba(196,122,46,.05);border-radius:12px;
  border:1px solid rgba(196,122,46,.14);}
.ls-sti{font-size:16px;line-height:1;}
.ls-stl{font-family:'Outfit',sans-serif;font-size:10.5px;color:#9B7450;line-height:1.4;}

.ls-lbl{font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:#9B7450;
  text-align:center;margin:2px 0 11px;}

.ls-llist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.ls-lb{display:flex;align-items:center;gap:14px;padding:15px 18px;
  background:#FFFFFF;border:1.5px solid rgba(28,10,4,.1);border-radius:16px;
  cursor:pointer;font-family:'Outfit',sans-serif;text-align:left;
  touch-action:manipulation;width:100%;
  transition:border-color .2s,box-shadow .2s,transform .15s;}
.ls-lb:hover{border-color:rgba(196,122,46,.4);box-shadow:0 4px 20px rgba(196,122,46,.1);}
.ls-lb:active{transform:scale(.98);}
.ls-lbf{font-size:24px;flex-shrink:0;}
.ls-lbt{flex:1;}
.ls-lbn{font-size:15px;font-weight:600;color:#1C0A04;display:block;}
.ls-lbs{font-size:12px;color:#9B7450;display:block;margin-top:1px;}
.ls-lbc{font-size:22px;color:#C47A2E;opacity:.6;flex-shrink:0;line-height:1;font-weight:300;}

.ls-foot{display:flex;justify-content:flex-end;margin-top:auto;
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);}
.ls-hw-bot{font-family:'Dancing Script',cursive;font-size:16px;color:#9B7450;
  opacity:.7;text-align:right;line-height:1.5;padding-left:72px;}

/* ── QUESTION SCREEN (light cream) ── */
.qs{background:#FAF7F2;position:relative;}

.q-top{padding:calc(env(safe-area-inset-top,0px)+14px) 24px 0;flex-shrink:0;}
.q-wm-line{text-align:center;margin-bottom:12px;}
.q-wm{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:600;
  letter-spacing:.4em;color:#1C0A04;display:block;text-transform:uppercase;
  padding-left:.4em;}
.q-wtag{font-family:'Outfit',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:.18em;color:#9B7450;text-transform:uppercase;display:block;
  margin-top:2px;}
.q-prog-row{display:flex;align-items:center;gap:10px;}
.q-segs{display:flex;gap:5px;flex:1;}
.q-seg{height:4px;border-radius:2px;flex:1;background:rgba(28,10,4,.12);
  transition:background .3s;}
.q-seg.on{background:#C47A2E;}
.q-seg.dn{background:#C47A2E;opacity:.4;}
.q-cnt{font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;
  color:#9B7450;flex-shrink:0;white-space:nowrap;}

.q-body{flex:1;display:flex;flex-direction:column;padding:14px 24px 0;
  padding-bottom:calc(env(safe-area-inset-bottom,0px)+148px);overflow-y:auto;}
.q-cat{font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#C47A2E;margin-bottom:12px;
  animation:fu .3s ease both;}
.q-head{font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(23px,6.5vw,29px);font-weight:600;line-height:1.22;
  color:#1C0A04;margin-bottom:9px;animation:fu .3s .04s ease both;}
.q-head em{font-style:italic;color:#C47A2E;}
.q-sub{font-family:'Outfit',sans-serif;font-size:13.5px;color:#9B7450;
  line-height:1.65;margin-bottom:15px;animation:fu .3s .08s ease both;}

.q-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:13px;
  animation:fu .3s .12s ease both;}
.q-ch{display:flex;align-items:center;gap:13px;padding:14px 16px;
  background:#FFFFFF;border:1.5px solid rgba(28,10,4,.1);border-radius:18px;
  cursor:pointer;font-family:'Outfit',sans-serif;text-align:left;
  touch-action:manipulation;width:100%;
  transition:border-color .2s,box-shadow .2s,transform .15s,opacity .3s;
  -webkit-user-select:none;user-select:none;}
.q-ch:active{transform:scale(.98);}
.q-ico{width:44px;height:44px;border-radius:50%;background:rgba(196,122,46,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;transition:background .2s;}
.q-txt{flex:1;}
.q-ct{font-size:14.5px;font-weight:600;color:#1C0A04;line-height:1.28;display:block;
  transition:color .2s;}
.q-cs{font-size:11.5px;color:#9B7450;margin-top:2px;display:block;}
.q-rad{width:22px;height:22px;border-radius:50%;
  border:2px solid rgba(28,10,4,.18);flex-shrink:0;
  transition:border-color .2s,background .2s,box-shadow .2s;}

/* selected YES — gold */
.q-ch.cy{border-color:#C47A2E;border-width:2px;
  box-shadow:0 4px 20px rgba(196,122,46,.16);}
.q-ch.cy .q-ico{background:rgba(196,122,46,.13);}
.q-ch.cy .q-ct{color:#C47A2E;}
.q-ch.cy .q-rad{border-color:#C47A2E;background:#C47A2E;
  box-shadow:inset 0 0 0 4px #FAF7F2;}

/* selected NO — ink */
.q-ch.cn{border-color:rgba(28,10,4,.32);border-width:2px;
  box-shadow:0 4px 12px rgba(28,10,4,.05);}
.q-ch.cn .q-ico{background:rgba(28,10,4,.05);}
.q-ch.cn .q-rad{border-color:#1C0A04;background:#1C0A04;
  box-shadow:inset 0 0 0 4px #FAF7F2;}

/* unchosen faded */
.q-ch.fd{opacity:.14;pointer-events:none;}

/* Next button */
.q-next{width:100%;padding:16px 24px;border-radius:50px;
  background:#C47A2E;border:none;
  font-family:'Outfit',sans-serif;font-size:15.5px;font-weight:600;
  color:#FFF;cursor:pointer;touch-action:manipulation;letter-spacing:.02em;
  transition:opacity .25s,transform .15s,box-shadow .2s;
  animation:fu .3s .16s ease both;}
.q-next:not([disabled]):hover{box-shadow:0 6px 24px rgba(196,122,46,.32);}
.q-next:not([disabled]):active{transform:scale(.98);}
.q-next[disabled]{opacity:.22;cursor:default;}

/* bottom decor — corner photo + handwriting */
.q-cp-br{position:absolute;width:148px;height:148px;
  border-radius:50% 12% 50% 50% / 50% 50% 50% 12%;
  right:-18px;bottom:28px;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,242,228,.88) 0%,transparent 38%),
    radial-gradient(circle at 68% 60%,rgba(235,165,120,.55) 0%,transparent 30%),
    radial-gradient(ellipse at 50% 52%,#EFC0A0 0%,#C06030 58%,#8A3A18 100%);
  box-shadow:0 6px 28px rgba(196,122,46,.16);}
.q-hw-bl{position:absolute;bottom:26px;left:18px;
  font-family:'Dancing Script',cursive;font-size:14.5px;color:#C47A2E;
  opacity:.58;line-height:1.6;pointer-events:none;z-index:1;}

/* empathy overlay — light theme overrides for .qs context */
.qs .eov[data-s="fade"]{background:linear-gradient(180deg,rgba(250,247,242,.95),#FAF7F2);}
.qs .eov[data-s="card"]{background:#FFFCF9;border-top:1.5px solid rgba(196,122,46,.2);
  box-shadow:0 -18px 56px rgba(28,10,4,.1);}
.qs .eov[data-s="wipe"]{background:#FFFCF9;border-bottom:1.5px solid rgba(196,122,46,.2);
  box-shadow:0 18px 56px rgba(28,10,4,.1);}
.qs .eov[data-s="punch"]{background:radial-gradient(ellipse 60% 50% at 50% 44%,
  rgba(196,122,46,.09),rgba(250,247,242,.96));}
.qs .et{color:#1C0A04;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;}
.qs .et b{color:#C47A2E;}
.qs .eb{color:#9B7450;font-family:'Outfit',sans-serif;}
.qs .eskip{color:#9B7450;}
.qs .epbar{background:rgba(28,10,4,.08);}
.qs .epfill{background:linear-gradient(90deg,#C47A2E,#CCAB4A);box-shadow:none;}

/* ── EMPATHY OVERLAY ── */
.eov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:48px 32px 80px;
  pointer-events:none;}
.eov.show{pointer-events:auto;}
.eov[data-s="fade"]{background:linear-gradient(180deg,var(--bg),var(--sf));
  opacity:0;transition:opacity .35s ease;}
.eov[data-s="fade"].show{opacity:1;}
.eov[data-s="card"]{top:auto;min-height:52%;background:var(--sf);
  align-items:center;text-align:center;padding:36px 32px 80px;
  opacity:1;transform:translateY(112%);
  transition:transform .5s cubic-bezier(.08,.9,.22,1);
  border-radius:24px 24px 0 0;border-top:1.5px solid var(--bdg);
  box-shadow:0 -24px 64px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.eov[data-s="card"].show{transform:translateY(0);}
.eov[data-s="wipe"]{bottom:auto;min-height:50%;background:var(--sf);
  align-items:center;text-align:center;padding:58px 32px 36px;
  opacity:1;transform:translateY(-112%);
  transition:transform .5s cubic-bezier(.08,.9,.22,1);
  border-radius:0 0 24px 24px;border-bottom:1.5px solid var(--bdg);
  box-shadow:0 24px 64px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.eov[data-s="wipe"].show{transform:translateY(0);}
.eov[data-s="punch"]{background:radial-gradient(ellipse 60% 50% at 50% 44%,
  rgba(200,155,60,.18),transparent);
  opacity:0;transform:scale(.8);
  transition:opacity .2s ease,transform .4s cubic-bezier(.15,1.6,.35,1);}
.eov[data-s="punch"].show{opacity:1;transform:scale(1);}

.ei{font-size:42px;margin-bottom:18px;
  animation:ipop .4s .1s cubic-bezier(.15,1.6,.35,1) both;}
@keyframes ipop{from{transform:scale(0);}to{transform:scale(1);}}
.et{font-size:21px;font-weight:900;color:var(--txt);line-height:1.4;margin-bottom:12px;}
.et b{color:var(--gl);}
.eb{font-size:15px;color:var(--dim);line-height:1.75;max-width:300px;}
.eov[data-s="card"] .et,.eov[data-s="wipe"] .et{font-size:19px;}
.eov[data-s="card"] .eb,.eov[data-s="wipe"] .eb{max-width:300px;}

/* progress bar inside overlay — now 3s to match new timing */
.epbar{position:absolute;bottom:40px;left:32px;right:32px;
  height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.epfill{height:100%;width:0%;
  background:linear-gradient(90deg,var(--gold),var(--gl));
  border-radius:2px;transition:width 3s linear;box-shadow:0 0 8px var(--gg);}

.eskip{position:absolute;bottom:14px;right:22px;
  font-size:12px;font-weight:700;color:var(--muted);
  padding:12px 16px;cursor:pointer;opacity:0;
  transition:opacity .4s .5s;touch-action:manipulation;}
.eov.show .eskip{opacity:1;}

/* ── FINAL Q (light cream) ── */
.fqs{background:#FAF7F2;position:relative;}
.fq-top{padding:calc(env(safe-area-inset-top,0px)+14px) 24px 0;flex-shrink:0;}
.fq-wm-line{text-align:center;margin-bottom:12px;}
.fq-wm{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;font-weight:600;
  letter-spacing:.4em;color:#1C0A04;display:block;text-transform:uppercase;
  padding-left:.4em;}
.fq-wtag{font-family:'Outfit',sans-serif;font-size:9px;font-weight:600;
  letter-spacing:.18em;color:#9B7450;text-transform:uppercase;display:block;
  margin-top:2px;}
.fq-segs-row{display:flex;align-items:center;gap:10px;}
.fq-segs{display:flex;gap:5px;flex:1;}
.fq-seg{height:4px;border-radius:2px;flex:1;background:#C47A2E;opacity:.38;}
.fq-lbl{font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;
  color:#9B7450;flex-shrink:0;}

.fqb{flex:1;display:flex;flex-direction:column;
  padding:14px 24px calc(env(safe-area-inset-bottom,0px)+24px);overflow-y:auto;}
.fqbadge{font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#C47A2E;
  margin-bottom:12px;animation:fu .3s ease both;display:block;}
.fqh{font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(22px,6vw,28px);font-weight:600;line-height:1.22;
  color:#1C0A04;margin-bottom:16px;animation:fu .3s .05s ease both;}
.fqlist{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;
  animation:fu .3s .1s ease both;}
.fqi{display:flex;align-items:flex-start;gap:12px;
  font-family:'Outfit',sans-serif;font-size:14px;color:#9B7450;line-height:1.55;}
.fqchk{width:20px;height:20px;border-radius:50%;background:rgba(196,122,46,.1);
  border:1.5px solid rgba(196,122,46,.3);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#C47A2E;flex-shrink:0;margin-top:1px;}
.fqend{font-family:'Outfit',sans-serif;font-size:15px;color:#9B7450;
  line-height:1.65;margin-bottom:14px;animation:fu .3s .15s ease both;}
.fqend strong{font-family:'Cormorant Garamond',Georgia,serif;
  font-size:20px;font-weight:600;color:#1C0A04;display:block;margin-top:5px;}
.fqopts{display:flex;flex-direction:column;gap:10px;animation:fu .3s .2s ease both;}
.fqbtn{width:100%;padding:16px 20px;border-radius:16px;
  border:1.5px solid rgba(28,10,4,.1);background:#FFFFFF;
  cursor:pointer;font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;
  color:#1C0A04;transition:border-color .2s,background .2s,transform .15s;
  text-align:left;touch-action:manipulation;}
.fqbtn:hover{border-color:rgba(196,122,46,.35);background:rgba(196,122,46,.04);}
.fqbtn:active{transform:scale(.98);}
.fqbtn.ch{background:rgba(196,122,46,.08);border-color:#C47A2E;border-width:2px;color:#C47A2E;}
.fqbtn.fd{opacity:.13;pointer-events:none;}
.fqresp{margin-top:14px;padding:18px 20px;
  background:rgba(196,122,46,.06);border:1.5px solid rgba(196,122,46,.25);
  border-radius:16px;font-family:'Outfit',sans-serif;
  font-size:15px;font-weight:500;color:#1C0A04;line-height:1.65;
  display:none;animation:fu .3s ease both;text-align:center;}
.fqresp b{color:#C47A2E;font-weight:700;}
.fqresp.show{display:block;}

/* ── REVEAL ── */
.ws{background:transparent;position:relative;overflow:hidden;}
.wp{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 28px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;}
.wp.in{opacity:1;pointer-events:auto;}
.wp.out{opacity:0;pointer-events:none;}

/* ph1 stat */
.sblk{text-align:center;margin-bottom:24px;}
.spre{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;}
.snum{font-size:min(19vw,96px);font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold),var(--gl),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:npop .5s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes npop{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:scale(1);}}
.spct{font-size:32px;font-weight:900;

/* ph2 pivot */
.pvpre{font-size:14px;color:var(--dim);text-align:center;margin-bottom:20px;letter-spacing:.3px;}

.wp.in .pvbig{opacity:1;transform:translateY(0);}

/* ph3 tendr */
.rlogo{width:min(155px,52vw);height:auto;margin-bottom:24px;flex-shrink:0;

.wp.in .rlogo{opacity:1;transform:scale(1) translateY(0);}
.feats{display:flex;flex-direction:column;gap:10px;width:100%;margin-bottom:24px;}
.feat{display:flex;align-items:center;gap:14px;padding:15px 18px;

.feat.in{opacity:1;transform:translateY(0);}
.fi{font-size:22px;flex-shrink:0;}
.ft{font-size:15px;font-weight:700;color:var(--txt);line-height:1.4;}

/* glow CTA */
.ctaw{position:relative;width:100%;}
.ctag{position:absolute;inset:-10px;border-radius:26px;
  background:radial-gradient(ellipse at 50% 50%,var(--gg),transparent 70%);

@keyframes cpulse{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:.72;transform:scale(1.05);}}
.ctab{display:flex;align-items:center;justify-content:center;

  background:linear-gradient(135deg,var(--gold),var(--gl));
  border:none;border-radius:20px;font-size:17px;font-weight:900;color:#09081A;

.ctab.in{opacity:1;}
.ctab:active{transform:scale(.97);}
.ctab::after{content:'';position:absolute;inset:0;

@keyframes sh{0%,44%{transform:translateX(-200%);}100%{transform:translateX(200%);}}

/* ── UTILS ── */
@keyframes fu{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

function prog(p){pf.style.width=p+'%';}

function go(html){
  const prev=app.querySelector('.screen');
  const w=document.createElement('div');w.innerHTML=html;
  const next=w.firstElementChild;
  next.style.cssText='transform:translateX(100%) scale(.95);opacity:0;';
  app.appendChild(next);
  if(prev){
    prev.style.transition='transform .38s cubic-bezier(.4,0,.8,0),opacity .32s ease';
    prev.style.transform='translateX(-26%) scale(.96)';
    prev.style.opacity='0';
    setTimeout(()=>prev.remove(),420);
  }
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    next.style.transition='transform .44s cubic-bezier(.08,.9,.22,1),opacity .36s ease';
    next.style.transform='translateX(0) scale(1)';
    next.style.opacity='1';
  }));
}

function dots(a){
  return[0,1,2,3].map(i=>`<div class="dot${i===a?' on':i<a?' dn':''}"></div>`).join('');
}

        <div class="ls-stt"><div class="ls-sti">⚡</div><div class="ls-stl">4 quick questions</div></div>
        <div class="ls-stt"><div class="ls-sti">🕐</div><div class="ls-stl">Takes only 30 sec</div></div>
        <div class="ls-stt"><div class="ls-sti">♡</div><div class="ls-stl">More relevant suggestions</div></div>
      </div>
      <div class="ls-lbl">CHOOSE YOUR LANGUAGE</div>
      <div class="ls-llist">
        <button class="ls-lb" onclick="setLang('en')"><div class="ls-lbf">🇬🇧</div><div class="ls-lbt"><span class="ls-lbn">English</span><span class="ls-lbs">Continue in English</span></div><div class="ls-lbc">›</div></button>
        <button class="ls-lb" onclick="setLang('hi')"><div class="ls-lbf">🇮🇳</div><div class="ls-lbt"><span class="ls-lbn">हिन्दी</span><span class="ls-lbs">हिंदी में चलते हैं</span></div><div class="ls-lbc">›</div></button>
        <button class="ls-lb" onclick="setLang('hl')"><div class="ls-lbf">✌️</div><div class="ls-lbt"><span class="ls-lbn">Hinglish</span><span class="ls-lbs">Mix karke chalte hain bhai</span></div><div class="ls-lbc">›</div></button>
      </div>
      <div class="ls-foot"><div class="ls-hw-bot">Let's create<br>something special</div></div>
    </div>
  </div>`);
}
function setLang(l){lang=l;yCount=0;renderQ(0);}

// ── QUESTION ──
function renderQ(idx){
  const q=L[lang].qs[idx];
  prog(PROG[idx+1]);
  const segs=[0,1,2,3].map(i=>`<div class="q-seg${i===idx?' on':i<idx?' dn':''}"></div>`).join('');
  go(`<div class="screen qs">
    <div class="q-top">
      <div class="q-wm-line"><span class="q-wm">TENDR</span><span class="q-wtag">PEOPLE · PLACES · EXPERIENCES</span></div>
      <div class="q-prog-row"><div class="q-segs">${segs}</div><div class="q-cnt">${idx+1} of 4</div></div>
    </div>
    <div class="q-body">
      <div class="q-cat">${q.badge}</div>
      <div class="q-head">${q.head}</div>
      <p class="q-sub">${q.sub}</p>
      <div class="q-cards">
        <button class="q-ch" id="by" onclick="ans('y',${idx})">
          <div class="q-ico">${q.y.em}</div>
          <div class="q-txt"><span class="q-ct">${q.y.t}</span><span class="q-cs">${q.y.s}</span></div>
          <div class="q-rad"></div>
        </button>
        <button class="q-ch" id="bn" onclick="ans('n',${idx})">
          <div class="q-ico">${q.n.em}</div>
          <div class="q-txt"><span class="q-ct">${q.n.t}</span><span class="q-cs">${q.n.s}</span></div>
          <div class="q-rad"></div>
        </button>
      </div>
      <button class="q-next" id="qnext" disabled onclick="advance(${idx})">Next →</button>
    </div>
    <div class="q-cp-br"></div>
    <div class="q-hw-bl">Great events<br>start with<br>great people</div>
    <div class="eov" id="eov" data-s="${STYLES[idx]}" onclick="advance(${idx})">
      <div class="ei" id="ei"></div>
      <div class="et" id="et"></div>
      <div class="eb" id="eb"></div>
      <div class="epbar"><div class="epfill" id="epf"></div></div>
      <div class="eskip">${L[lang].skip[idx]}</div>
    </div>
  </div>`);
}

function advance(idx){
  clearTimeout(adv);
  idx<3?renderQ(idx+1):showFQ();
}

function ans(w,idx){
  const by=document.getElementById('by'),bn=document.getElementById('bn');
  if(by.disabled)return;
  by.disabled=true;bn.disabled=true;
  const q=L[lang].qs[idx];
  const ov=w==='y'?q.oy:q.on;
  if(w==='y'){
    by.classList.add('cy');bn.classList.add('fd');
    yCount++;
  } else {
    bn.classList.add('cn');by.classList.add('fd');
  }
  const nxt=document.getElementById('qnext');
  if(nxt) nxt.removeAttribute('disabled');
  const el=document.getElementById('eov');
  document.getElementById('ei').textContent=ov.icon;
  document.getElementById('et').innerHTML=ov.t;
  document.getElementById('eb').innerHTML=ov.b;
  const st=el.dataset.s;
  setTimeout(()=>el.classList.add('show'),st==='card'||st==='wipe'?55:120);
  setTimeout(()=>{
    const f=document.getElementById('epf');
    if(f) requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width='100%'));
  },360);
  adv=setTimeout(()=>advance(idx),3400);
}

// ── FINAL Q ──
function showFQ(){
  const fq=L[lang].fq;
  prog(PROG[5]);
  const allDone='<div class="fq-seg" style="opacity:1"></div>'.repeat(4);
  go(`<div class="screen fqs">
    <div class="fq-top">
      <div class="fq-wm-line"><span class="fq-wm">TENDR</span><span class="fq-wtag">PEOPLE · PLACES · EXPERIENCES</span></div>
      <div class="fq-segs-row"><div class="fq-segs">${allDone}</div><div class="fq-lbl">Final</div></div>
    </div>
    <div class="fqb">
      <div class="fqbadge">${fq.badge}</div>
      <div class="fqh">${fq.head}</div>
      <div class="fqlist">${fq.items.map(it=>`<div class="fqi"><div class="fqchk">✓</div><span>${it}</span></div>`).join('')}</div>
      <div class="fqend">${fq.end}<strong></strong></div>
      <div class="fqopts">${fq.opts.map((o,i)=>`<button class="fqbtn" id="fo${i}" onclick="ansFQ(${i})">${o.l}</button>`).join('')}</div>
      <div class="fqresp" id="fqr"></div>
    </div>
  </div>`);
}

function ansFQ(c){
  [0,1,2].forEach(i=>{const b=document.getElementById('fo'+i);if(b)b.disabled=true;});
  document.getElementById('fo'+c)?.classList.add('ch');
  [0,1,2].filter(i=>i!==c).forEach(i=>document.getElementById('fo'+i)?.classList.add('fd'));
  fqc=c;
  const r=document.getElementById('fqr');
  r.innerHTML=L[lang].fq.resp[c];r.style.display='block';
  setTimeout(()=>r.classList.add('show'),30);
  setTimeout(showReveal,3000);
}

// ── REVEAL ──
function showReveal(){
  const r=L[lang].rev;
  const opener=L[lang].fq.opts[fqc]?.o||L[lang].fq.opts[0].o;
  prog(100);

  // Branch pvbig based on how many "Yes" answers they gave
  let pvIdx = yCount >= 3 ? 0 : yCount >= 1 ? 1 : 2;
  const pvbig = r.pvbigs[pvIdx];

  go(`<div class="screen ws">
    <div class="wp" id="ph1">
      <div class="sblk">
        <div class="spre">${r.spre}</div>
        <div class="snum">8<span style="font-size:.45em;vertical-align:middle"> in </span>10</div>
        <div class="ssub">${r.ssub}</div>
      </div>
      <div class="pills">${r.pills.map((p,i)=>`<div class="pill" id="pl${i}">${p}</div>`).join('')}</div>
    </div>
    <div class="wp" id="ph2">
      <div class="pvpre">${opener}</div>
      <div class="pvbig">${pvbig}</div>
    </div>
    <div class="wp" id="ph3">
      ${LOGO}
      <div class="feats">${r.feats.map((f,i)=>`<div class="feat" id="wf${i}"><span class="fi">${f.i}</span><span class="ft">${f.t}</span></div>`).join('')}</div>
      <div class="ctaw">
        <div class="ctag"></div>
        <a class="ctab" id="wcta" href="https://tendr.co.in?skip_intro=1" target="_blank">${r.cta}</a>
      </div>
    </div>
  </div>`);

  setTimeout(()=>document.getElementById('ph1')?.classList.add('in'),100);
  r.pills.forEach((_,i)=>setTimeout(()=>document.getElementById('pl'+i)?.classList.add('in'),800+i*110));

  setTimeout(()=>{
    const p=document.getElementById('ph1');
    if(p){p.classList.remove('in');p.classList.add('out');}
    setTimeout(()=>document.getElementById('ph2')?.classList.add('in'),480);
  },3800);

  setTimeout(()=>{
    const p=document.getElementById('ph2');
    if(p){p.classList.remove('in');p.classList.add('out');}
    setTimeout(()=>{
      document.getElementById('ph3')?.classList.add('in');
      r.feats.forEach((_,i)=>setTimeout(()=>document.getElementById('wf'+i)?.classList.add('in'),300+i*140));
      setTimeout(()=>document.getElementById('wcta')?.classList.add('in'),1000);
    },480);
  },7000);
}

langScreen();
</script>
</body>
