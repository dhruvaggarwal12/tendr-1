<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tendr — Links</title>
  <meta name="description" content="Delhi NCR's home for curated event vendors. Find us on all platforms." />
  <link rel="icon" href="/tendr-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #FAF7F2;
      --surface:       rgba(255,255,255,0.82);
      --surface-hover: rgba(196,122,46,0.06);
      --gold:          #C47A2E;
      --gold-mid:      #D4A040;
      --gold-bright:   #CCAB4A;
      --text:          #1C0E04;
      --text-sub:      rgba(28,14,4,0.44);
      --border:        rgba(196,122,46,0.18);
      --border-hover:  rgba(196,122,46,0.42);
      --radius-card:   15px;
      --radius-icon:   11px;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* top gold hairline */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold-bright) 70%, transparent);
      z-index: 10;
    }

    /* ambient glow */
    .glow-top {
      position: fixed;
      top: -100px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 360px;
      background: radial-gradient(ellipse, rgba(196,122,46,0.07) 0%, transparent 66%);
      pointer-events: none;
      z-index: 0;
    }
    .glow-bot {
      position: fixed;
      bottom: -60px; right: -40px;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(196,122,46,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      padding: 64px 20px 72px;
      position: relative;
      z-index: 1;
    }

    /* ── Brand ── */
    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-img {
      width: auto;
      height: 64px;
      max-width: 220px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px;
    }

    .tagline {
      font-size: 12.5px;
      color: var(--text-sub);
      line-height: 1.6;
      letter-spacing: 0.01em;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,122,46,0.22) 25%, rgba(196,122,46,0.22) 75%, transparent);
      margin: 24px 0;
    }

    /* ── PRIMARY CTA ── */
    .cta-primary {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-mid) 50%, var(--gold-bright) 100%);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 15.5px; font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      touch-action: manipulation;
      box-shadow: 0 6px 22px rgba(196,122,46,0.30), 0 2px 8px rgba(0,0,0,0.14);
      transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.16s ease;
      margin-bottom: 22px;
      animation: fadeUp 0.38s cubic-bezier(0.34,1.2,0.64,1) 0.06s both;
      -webkit-tap-highlight-color: transparent;
    }
    .cta-primary:active {
      transform: scale(0.96);
      box-shadow: 0 3px 10px rgba(196,122,46,0.2);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .cta-icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.9;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 9.5px; font-weight: 700;
      color: rgba(140,80,20,0.52);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 20px 0 9px 2px;
    }

    /* ── Link cards ── */
    .links { display: flex; flex-direction: column; gap: 8px; }

    .link-card {
      display: flex; align-items: center; gap: 13px;
      padding: 0 15px 0 12px;
      height: 62px;
      border-radius: var(--radius-card);
      border: 1px solid var(--border);
      background: var(--surface);
      text-decoration: none;
      cursor: pointer;
      width: 100%; text-align: left;
      font-family: inherit; color: inherit;
      outline: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease;
    }
    .link-card:active {
      transform: scale(0.97);
      transition: transform 0.08s ease, background 0.08s, border-color 0.08s;
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    /* stagger-sequence: 40ms per item */
    .link-card:nth-child(1) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.10s both; }
    .link-card:nth-child(2) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.14s both; }
    .link-card:nth-child(3) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.18s both; }
    .link-card:nth-child(4) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.22s both; }
    .link-card:nth-child(5) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.26s both; }
    .link-card:nth-child(6) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.30s both; }
    .link-card:nth-child(7) { animation: fadeUp 0.36s cubic-bezier(0.34,1.2,0.64,1) 0.34s both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Icon pills — brand-matched per platform */
    .icon-pill {
      width: 40px; height: 40px;
      border-radius: var(--radius-icon);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .icon-pill svg { display: block; }

    .icon-pill.web       { background: rgba(196,122,46,0.13); }
    .icon-pill.whatsapp  { background: rgba(37,211,102,0.13); }
    .icon-pill.instagram { background: rgba(228,64,95,0.10); }
    .icon-pill.x         { background: rgba(28,14,4,0.07); }
    .icon-pill.linkedin  { background: rgba(10,102,194,0.11); }
    .icon-pill.vendor    { background: rgba(196,122,46,0.11); }
    .icon-pill.vcard     { background: rgba(80,120,220,0.10); }

    .link-info { flex: 1; min-width: 0; }

    .link-label {
      font-size: 14.5px; font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em; line-height: 1.3;
    }
    .link-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .chevron {
      color: rgba(196,122,46,0.48);
      flex-shrink: 0;
      transition: transform 0.18s ease, color 0.18s;
    }
    .link-card:active .chevron {
      transform: translateX(3px);
      color: var(--gold);
    }

    /* ── Footer ── */
    .foot {
      margin-top: 40px; text-align: center;
      font-size: 11px; color: rgba(28,14,4,0.2);
      letter-spacing: 0.05em;
    }

    @media (prefers-reduced-motion: reduce) {
      .link-card, .cta-primary { animation: none !important; }
      .link-card, .link-card .chevron, .cta-primary { transition: none !important; }
    }
  </style>
</head>
